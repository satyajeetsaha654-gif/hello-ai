<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Hello AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    border:0;
    outline:none;
    cursor:pointer;
}

textarea{
    outline:none;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    background:#000;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    background:rgba(0,0,0,.94);
    border-bottom:none;
    display:flex;
    align-items:center;
    z-index:100;
    padding:0 14px;
}

.menu-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:25px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.menu-btn:active{
    background:#1b1b1b;
}

.logo-title{
    margin-left:8px;
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
}

#chat{
    position:absolute;
    top:62px;
    left:0;
    right:0;
    bottom:92px;
    overflow-y:auto;
    padding:18px 14px 25px;
    scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#333;
}

#welcome{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

/* ===== HELLO AI WELCOME LOGO ===== */

.welcome-logo{
    width:92px;
    height:92px;
    border-radius:50%;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050505;
    border:2px solid #f2f2f2;

    box-shadow:
        0 0 0 1px #151515,
        0 0 18px rgba(255,255,255,.12),
        inset 0 0 20px rgba(255,255,255,.04);

    margin-bottom:0;

    animation:
        helloLogoFloat 3s ease-in-out infinite;
}

.welcome-logo::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;

    border:1px solid rgba(255,255,255,.55);

    box-shadow:
        0 0 0 1px rgba(0,0,0,.8);

    pointer-events:none;
}

.welcome-logo::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;

    border:1px solid rgba(255,255,255,.13);

    pointer-events:none;
}

.welcome-logo-symbol{
    width:58px;
    height:58px;

    position:relative;
    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-logo-symbol svg{
    width:56px;
    height:56px;
    display:block;
}

@keyframes helloLogoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-3px);
    }

}

.welcome-logo-name{
    margin-top:14px;

    font-size:15px;
    font-weight:600;
    letter-spacing:.5px;

    color:#fff;
    line-height:1;

}

.welcome-title{
    display:none;
}

.welcome-text{
    color:#8e8e8e;
    font-size:14px;
    max-width:300px;
    line-height:1.6;

    margin-top:11px;
}

/* ===== END WELCOME LOGO ===== */

.message-row{
    width:100%;
    display:flex;
    margin:10px 0 18px;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.ai{
    justify-content:flex-start;
}

.message-bubble{
    max-width:min(88%,720px);
    line-height:1.65;
    font-size:15px;
    word-break:break-word;
}

.user-bubble{
    background:#1478ff;
    padding:11px 15px;
    border-radius:19px 19px 5px 19px;
    white-space:pre-wrap;
}

.ai-container{
    max-width:min(94%,760px);
}

.ai-bubble{
    color:#f3f3f3;
}

.ai-bubble p{
    margin:0 0 12px;
}

.ai-bubble p:last-child{
    margin-bottom:0;
}

.ai-bubble h1,
.ai-bubble h2,
.ai-bubble h3,
.ai-bubble h4{
    margin:15px 0 8px;
    color:#fff;
}

.ai-bubble ul,
.ai-bubble ol{
    padding-left:23px;
    margin:9px 0;
}

.ai-bubble li{
    margin:5px 0;
}

.ai-bubble strong{
    color:#fff;
    font-weight:700;
}

.ai-bubble em{
    color:#ddd;
}

.ai-bubble code{
    background:#181818;
    padding:2px 6px;
    border-radius:5px;
    font-size:13px;
}

.ai-bubble pre{
    background:#111;
    border:1px solid #252525;
    padding:12px;
    border-radius:10px;
    overflow-x:auto;
}

.ai-bubble pre code{
    padding:0;
    background:transparent;
}

.ai-bubble blockquote{
    border-left:3px solid #3d8cff;
    padding-left:12px;
    margin:10px 0;
    color:#bcbcbc;
}

.ai-bubble hr{
    border:0;
    border-top:1px solid #292929;
    margin:14px 0;
}

.ai-actions{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:9px;
    flex-wrap:wrap;
}

.action-btn{
    background:transparent;
    color:#858585;
    padding:6px 8px;
    border-radius:7px;
    font-size:12px;
    transition:.2s;
}

.action-btn:hover{
    color:#fff;
    background:#171717;
}

.action-btn:active{
    background:#222;
}

.typing{
    display:flex;
    align-items:center;
    gap:5px;
    padding:8px 0;
}

.typing span{
    width:6px;
    height:6px;
    background:#777;
    border-radius:50%;
    animation:typing 1.1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    30%{
        opacity:1;
        transform:translateY(-4px);
    }
}

.bottom-area{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:92px;
    background:linear-gradient(
        to top,
        #000 65%,
        rgba(0,0,0,.92)
    );
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:8px 12px 17px;
    z-index:90;
}

.input-box{
    width:min(900px,100%);
    min-height:56px;
    background:#171717;
    border:1px solid #292929;
    border-radius:29px;
    display:flex;
    align-items:flex-end;
    padding:7px 8px 7px 7px;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
}

.plus-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#252525;
    color:#fff;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:5px;
}

.plus-btn:active{
    background:#333;
}

#messageInput{
    flex:1;
    min-width:0;
    max-height:120px;
    min-height:40px;
    resize:none;
    border:0;
    background:transparent;
    color:#fff;
    font-size:15px;
    line-height:1.45;
    padding:10px 7px;
}

#messageInput::placeholder{
    color:#777;
}

#mainAction{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#1478ff;
    color:#fff;
    margin-left:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:
        background .25s,
        border-radius .25s,
        transform .25s,
        width .25s;
}

#mainAction:active{
    transform:scale(.92);
}

.wave-icon{
    width:22px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
}

.wave-icon span{
    width:2.5px;
    border-radius:3px;
    background:#fff;
    display:block;
}

.wave-icon span:nth-child(1){
    height:7px;
}

.wave-icon span:nth-child(2){
    height:13px;
}

.wave-icon span:nth-child(3){
    height:18px;
}

.wave-icon span:nth-child(4){
    height:11px;
}

.wave-icon span:nth-child(5){
    height:6px;
}

.send-icon{
    font-size:19px;
    transform:translateX(1px);
}

#mainAction.processing{
    width:46px;
    border-radius:13px;
    background:#454545;
}

.processing-dots{
    display:flex;
    gap:4px;
}

.processing-dots span{
    width:5px;
    height:5px;
    background:#ddd;
    border-radius:50%;
    animation:process 1s infinite;
}

.processing-dots span:nth-child(2){
    animation-delay:.15s;
}

.processing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes process{
    0%,100%{
        opacity:.3;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}

#plusMenu{
    position:fixed;
    left:14px;
    bottom:82px;
    width:190px;
    background:#181818;
    border:1px solid #2c2c2c;
    border-radius:16px;
    padding:7px;
    z-index:200;
    display:none;
    box-shadow:0 10px 35px rgba(0,0,0,.55);
}

.plus-item{
    width:100%;
    height:43px;
    background:transparent;
    color:#eee;
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 11px;
    border-radius:10px;
    text-align:left;
}

.plus-item:hover{
    background:#252525;
}

.plus-icon{
    width:24px;
    text-align:center;
}

#historyOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:300;
    display:none;
}

#historyDrawer{
    position:absolute;
    top:0;
    bottom:0;
    left:0;
    width:min(320px,88vw);
    background:#111;
    border-right:1px solid #292929;
    transform:translateX(-100%);
    transition:transform .25s ease;
    padding:18px 13px;
    overflow-y:auto;
}

#historyDrawer.open{
    transform:translateX(0);
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 5px 17px;
}

.history-logo{
    font-size:19px;
    font-weight:600;
}

.close-history{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:20px;
}

.new-chat{
    width:100%;
    background:#1d1d1d;
    color:#fff;
    border-radius:11px;
    padding:12px;
    text-align:left;
    margin-bottom:18px;
}

.history-section-title{
    color:#777;
    font-size:12px;
    margin:14px 8px 7px;
}

.history-item{
    width:100%;
    background:transparent;
    color:#ddd;
    padding:11px 10px;
    border-radius:9px;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
}

.history-item:hover{
    background:#1e1e1e;
}

.history-empty{
    color:#666;
    font-size:13px;
    padding:8px;
}

#voiceScreen{
    position:fixed;
    inset:0;
    background:#000;
    z-index:500;
    display:none;
    flex-direction:column;
}

.voice-header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.voice-title{
    font-size:18px;
    font-weight:600;
}

.voice-close{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1c1c1c;
    color:#fff;
    font-size:22px;
}

.voice-content{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding-bottom:50px;
}

.voice-orb{
    width:170px;
    height:170px;
    border-radius:50%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(
        circle,
        #3b8cff 0%,
        #0753d7 42%,
        #03152f 72%,
        #000 100%
    );
    box-shadow:
        0 0 50px rgba(25,115,255,.3);
    transition:.35s;
}

.voice-orb::before,
.voice-orb::after{
    content:"";
    position:absolute;
    border:1px solid rgba(70,140,255,.35);
    border-radius:50%;
    animation:orbPulse 2.2s infinite;
}

.voice-orb::before{
    inset:-15px;
}

.voice-orb::after{
    inset:-30px;
    animation-delay:.6s;
}

.voice-orb.thinking{
    background:radial-gradient(
        circle,
        #a855f7 0%,
        #6320b5 45%,
        #17082c 75%,
        #000 100%
    );
    box-shadow:0 0 60px rgba(168,85,247,.4);
}

.voice-orb.speaking{
    background:radial-gradient(
        circle,
        #25d98c 0%,
        #087a50 45%,
        #022419 75%,
        #000 100%
    );
    box-shadow:0 0 60px rgba(37,217,140,.35);
}

.voice-orb.interrupted{
    background:radial-gradient(
        circle,
        #ffb020 0%,
        #9c5500 45%,
        #291600 75%,
        #000 100%
    );
}

@keyframes orbPulse{
    0%{
        transform:scale(.92);
        opacity:.7;
    }

    70%{
        transform:scale(1.08);
        opacity:0;
    }

    100%{
        transform:scale(1.08);
        opacity:0;
    }
}

.voice-wave{
    display:flex;
    align-items:center;
    gap:4px;
    height:50px;
}

.voice-wave span{
    width:4px;
    height:15px;
    border-radius:5px;
    background:#fff;
    animation:voiceWave 1s infinite ease-in-out;
}

.voice-wave span:nth-child(1){
    animation-delay:.05s;
}

.voice-wave span:nth-child(2){
    animation-delay:.15s;
}

.voice-wave span:nth-child(3){
    animation-delay:.25s;
}

.voice-wave span:nth-child(4){
    animation-delay:.35s;
}

.voice-wave span:nth-child(5){
    animation-delay:.45s;
}

@keyframes voiceWave{
    0%,100%{
        transform:scaleY(.5);
    }

    50%{
        transform:scaleY(1.7);
    }
}

.voice-status{
    margin-top:45px;
    font-size:20px;
    font-weight:500;
}

.voice-substatus{
    margin-top:9px;
    color:#777;
    font-size:13px;
}

.voice-bottom{
    min-height:100px;
    padding:10px 18px 25px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.voice-control{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#1d1d1d;
    color:#fff;
    font-size:20px;
}

.voice-control.end{
    background:#e53935;
}

.voice-control:active{
    transform:scale(.92);
}

.voice-control-label{
    position:absolute;
    margin-top:73px;
    font-size:11px;
    color:#777;
}

.voice-input-area{
    position:absolute;
    left:15px;
    right:15px;
    bottom:92px;
    display:none;
}

.voice-text-input{
    width:100%;
    background:#171717;
    border:1px solid #292929;
    border-radius:20px;
    padding:13px;
    color:#fff;
}

.hidden-input{
    display:none;
}

#toast{
    position:fixed;
    left:50%;
    bottom:105px;
    transform:translateX(-50%) translateY(20px);
    background:#252525;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:900;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){

    .message-bubble{
        font-size:15px;
    }

    .ai-container{
        max-width:96%;
    }

    .voice-orb{
        width:145px;
        height:145px;
    }

    .voice-status{
        margin-top:35px;
    }

    .welcome-logo{
        width:82px;
        height:82px;
    }

}

</style>
</head>

<body>

<div id="app">

<header class="header">

    <button
        class="menu-btn"
        id="historyBtn"
        aria-label="Chat history">
        ☰
    </button>

    <div class="logo-title">
        Hello AI
    </div>

</header>

<main id="chat">

    <div id="welcome">

        <div class="welcome-logo">

            <div class="welcome-logo-symbol">

                <svg
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="Hello AI logo">

                    <circle
                        cx="50"
                        cy="50"
                        r="43"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="3"/>

                    <path
                        d="M50 17
                           C39 17 32 24 32 35
                           C32 42 36 47 42 50
                           C36 53 32 58 32 65
                           C32 76 39 83 50 83
                           C61 83 68 76 68 65
                           C68 58 64 53 58 50
                           C64 47 68 42 68 35
                           C68 24 61 17 50 17Z"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="6"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <path
                        d="M25 50
                           C25 39 33 32 44 32
                           C50 32 55 35 59 40
                           C63 35 68 32 75 32"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="6"
                        stroke-linecap="round"/>

                    <path
                        d="M25 50
                           C25 61 33 68 44 68
                           C50 68 55 65 59 60
                           C63 65 68 68 75 68"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="6"
                        stroke-linecap="round"/>

                </svg>

            </div>

        </div>

        <div class="welcome-logo-name">
            Hello Ai
        </div>

        <div class="welcome-text">
            Ask anything, anyway. I’m ready.
        </div>

    </div>

</main>

<div class="bottom-area">

    <div class="input-box">

        <button
            class="plus-btn"
            id="plusBtn">
            +
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask Hello AI anything..."
            autocomplete="off"></textarea>

        <button
            id="mainAction"
            aria-label="Voice">

            <div class="wave-icon">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </button>

    </div>

</div>

<div id="plusMenu">

    <button class="plus-item" id="cameraBtn">
        <span class="plus-icon">📷</span>
        Camera
    </button>

    <button class="plus-item" id="galleryBtn">
        <span class="plus-icon">🖼️</span>
        Gallery
    </button>

    <button class="plus-item" id="documentBtn">
        <span class="plus-icon">📄</span>
        Document
    </button>

    <button class="plus-item" id="imageBtn">
        <span class="plus-icon">✨</span>
        Create Image
    </button>

</div>

<input
    id="cameraInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    capture="environment">

<input
    id="galleryInput"
    class="hidden-input"
    type="file"
    accept="image/*">

<input
    id="documentInput"
    class="hidden-input"
    type="file"
    accept=".pdf,.txt,.doc,.docx,image/*">

<div id="historyOverlay">

    <aside id="historyDrawer">

        <div class="history-header">

            <div class="history-logo">
                Hello AI
            </div>

            <button
                class="close-history"
                id="closeHistory">
                ×
            </button>

        </div>

        <button
            class="new-chat"
            id="newChatBtn">
            ＋ New Chat
        </button>

        <div class="history-section-title">
            Today
        </div>

        <div id="todayHistory"></div>

        <div class="history-section-title">
            Yesterday
        </div>

        <div id="yesterdayHistory"></div>

    </aside>

</div>

<section id="voiceScreen">

    <div class="voice-header">

        <div class="voice-title">
            Hello AI
        </div>

        <button
            class="voice-close"
            id="voiceClose">
            ×
        </button>

    </div>

    <div class="voice-content">

        <div
            class="voice-orb"
            id="voiceOrb">

            <div class="voice-wave">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

        <div
            class="voice-status"
            id="voiceStatus">
            Ready
        </div>

        <div
            class="voice-substatus"
            id="voiceSubstatus">
            Tap the center to start
        </div>

    </div>

    <div class="voice-bottom">

        <div style="position:relative;">

            <button
                class="voice-control"

function cleanAIText(text){

    if(
        text === null ||
        text === undefined
    ){

        return "";

    }

    let value =
        String(text)
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n");

    value =
        value
        .split("\n")
        .filter(line => {

            const t =
                line.trim();

            if(!t){

                return true;

            }

            if(
                /^[*_\-=~#/\\|<>]{4,}$/.test(t)
            ){

                return false;

            }

            return true;

        })
        .join("\n");

    value =
        value
        .replace(
            /([*#_~])\1{5,}/g,
            "$1$1"
        )
        .replace(
            /-{6,}/g,
            "---"
        )
        .replace(
            /_{6,}/g,
            "___"
        );

    return value.trim();

}

function renderMarkdown(text){

    const clean =
        cleanAIText(text);

    if(!clean){

        return "";

    }

    try{

        const html =
            marked.parse(
                clean,
                {
                    breaks:true,
                    gfm:true
                }
            );

        return DOMPurify.sanitize(
            html
        );

    }catch(e){

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            clean;

        return div.innerHTML
            .replace(
                /\n/g,
                "<br>"
            );

    }

}

function copyText(text){

    if(!text){

        return;

    }

    navigator.clipboard
        .writeText(text)
        .then(
            () => showToast("Copied")
        )
        .catch(
            () => {

                const temp =
                    document.createElement(
                        "textarea"
                    );

                temp.value = text;

                document.body.appendChild(temp);

                temp.select();

                document.execCommand("copy");

                temp.remove();

                showToast("Copied");

            }
        );

}

function speakText(text){

    if(!text){

        return;

        }

    if(
        !("speechSynthesis" in window)
    ){

        showToast(
            "Speech is not supported"
        );

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        detectLanguage(text);

    utterance.rate = .95;

    window.speechSynthesis.speak(
        utterance
    );

}

function detectLanguage(text){

    if(
        /[\u0980-\u09FF]/.test(text)
    ){

        return "bn-IN";

    }

    if(
        /[\u0900-\u097F]/.test(text)
    ){

        return "hi-IN";

    }

    return "en-IN";

}

async function shareText(text){

    if(!text){

        return;

    }

    try{

        if(navigator.share){

            await navigator.share({

                title:"Hello AI",

                text:text

            });

        }else{

            await copyText(text);

            showToast(
                "Sharing not supported. Copied instead."
            );

        }

    }catch(e){

        if(
            e.name !== "AbortError"
        ){

            showToast(

            );

        }

    }

}

async function regenerateLast(){

    if(isProcessing){

        return;

    }

    const current =
        getCurrentChat();

    if(!current){

        return;

    }

    let lastUserIndex = -1;

    for(
        let i =
            current.messages.length - 1;
        i >= 0;
        i--
    ){

        if(
            current.messages[i].role ===
            "user"
        ){

            lastUserIndex = i;

            break;

        }

    }

    if(lastUserIndex === -1){

        return;

    }

    const question =
        current.messages[
            lastUserIndex
        ].content;

    current.messages =
        current.messages.slice(
            0,
            lastUserIndex + 1
        );

    current.updatedAt =
        Date.now();

    saveHistory();

    renderChat();

    await sendQuestion(
        question,
        true
    );

}

async function sendQuestion(
    question,
    regenerate=false
){

    if(isProcessing){

        return;

    }

    question =
        String(question || "")
        .trim();

    if(!question){

        return;

    }

    const current =
        ensureCurrentChat();

    if(!regenerate){

        current.messages.push({

            role:"user",

            content:question

        });

        updateChatTitle(current);

        current.updatedAt =
            Date.now();

        saveHistory();

        renderChat();

    }else{

        renderChat();

    }

    messageInput.value = "";

    messageInput.style.height =
        "40px";

    isProcessing = true;

    updateMainAction();

    const typingRow =
        document.createElement(
            "div"
        );

    typingRow.className =
        "message-row ai";

    typingRow.innerHTML = `

        <div class="ai-container">

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;

    chat.appendChild(typingRow);

    scrollToBottom();

    try{

        const recent =
            current.messages
                .slice(-MAX_CONTEXT)
                .map(m => ({

                    role:
                        m.role === "assistant"
                            ? "assistant"
                            : "user",

                    content:
                        String(
                            m.content || ""
                        )

                }));

        const response =
            await fetch(
                "/ask",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:question,

                        history:recent,

                        voice_mode:false,

                        timezone_offset_minutes:
                            new Date()
                                .getTimezoneOffset()

                    })

                }
            );

        let data = {};

        try{

            data =
                await response.json();

        }catch(e){}

        typingRow.remove();

        if(
            !response.ok ||
            !data
        ){

            throw new Error(
                data.error ||
                "Request failed"
            );

        }

        const answer =
            cleanAIText(
                data.answer ||
                data.response ||
                data.message ||
                ""
            );

        if(!answer){

            throw new Error(
                "AI returned an empty response."
            );

        }

        current.messages.push({

            role:"assistant",

            content:answer

        });

        current.updatedAt =
            Date.now();

        saveHistory();

        renderChat();

    }catch(error){

        typingRow.remove();

        const errorMessage =
            "Sorry, I couldn't get a response right now. Please try again.";

        current.messages.push({

            role:"assistant",

            content:errorMessage

        });

        current.updatedAt =
            Date.now();

        saveHistory();

        renderChat();

        console.error(
            "ASK ERROR:",
            error
        );

    }finally{

        isProcessing = false;

        updateMainAction();

    }

}

            console.error(
                "DOCUMENT ERROR:",
                error
            );

        }finally{

            isProcessing = false;

            updateMainAction();

            event.target.value = "";

        }

    }
);

function closeVoiceMode(){

    stopVoiceRecording();

    stopCurrentVoiceAudio();

    voiceScreen.style.display =
        "none";

    isVoiceMode = false;

    voiceInputArea.style.display =
        "none";

    setVoiceState(
        "ready"
    );

    "voiceClose"

document.getElementById(
    "endVoice"
).onclick = () => {

    voiceStopRequested = true;

    if(
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ){

        setVoiceState(
            "thinking"
        );

        stopVoiceRecording();

    }else{

        showToast(
            "Nothing is recording."
        );

    }

};

function setVoiceState(state){

    voiceOrb.className =
        "voice-orb";

    if(state === "ready"){

        voiceStatus.textContent =
            "Ready";

        voiceSubstatus.textContent =
            "Tap the center to start";

    }

    if(state === "listening"){

        voiceStatus.textContent =
            "Listening";

        voiceSubstatus.textContent =
            "I'm listening...";

        voiceOrb.classList.add(
            "listening"
        );

    }

    if(state === "thinking"){

        voiceStatus.textContent =
            "Thinking";

        voiceSubstatus.textContent =
            "Hello AI is thinking...";

        voiceOrb.classList.add(
            "thinking"
        );

    }

    if(state === "speaking"){

        voiceStatus.textContent =
            "Speaking";

        voiceSubstatus.textContent =
            "Hello AI is speaking";

        voiceOrb.classList.add(
            "speaking"
        );

    }

    if(state === "interrupted"){

        voiceStatus.textContent =
            "Interrupted";

        voiceSubstatus.textContent =
            "Listening again...";

        voiceOrb.classList.add(
            "interrupted"
        );

    }

}

voiceOrb.addEventListener(
    "click",
    async () => {

        if(mediaRecorder){

            stopVoiceRecording();

        }else{

            voiceStopRequested = false;

            await startVoiceRecording();

        }

    }
);

async function startVoiceRecording(){

    try{

        voiceStopRequested = false;

        voiceStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(
                voiceStream
            );

        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async () => {

                const recorder =
                    mediaRecorder;

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                recorder &&
                                recorder.mimeType
                                    ? recorder.mimeType
                                    : "audio/webm"
                        }
                    );

                mediaRecorder = null;

                await processVoiceBlob(
                    blob
                );

            };

        mediaRecorder.start();

        setVoiceState(
            "listening"
        );

    }catch(error){

        console.error(
            "MIC ERROR:",
            error
        );

        mediaRecorder = null;

        if(voiceStream){

            voiceStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            voiceStream = null;

        }

        showToast(
            "Microphone permission is required."
        );

    }

}

function stopVoiceRecording(){

    if(mediaRecorder){

        try{

            if(
                mediaRecorder.state ===
                "recording"
            ){

                mediaRecorder.stop();

            }

        }catch(e){

            console.error(
                "STOP RECORDING ERROR:",
                e
            );

        }

    }

    if(voiceStream){

        voiceStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        voiceStream = null;

    }

}

async function processVoiceBlob(
    blob
){

    setVoiceState(
        "thinking"
    );

    try{

        const formData =
            new FormData();

        formData.append(
            "audio",
            blob,
            "voice.webm"
        );

        const transcribeResponse =
            await fetch(
                "/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );

        const transcriptData =
            await transcribeResponse.json();

        if(
            !transcribeResponse.ok
        ){

            throw new Error(
                transcriptData.error ||
                "Transcription failed"
            );

        }

        const transcript =
            String(
                transcriptData.text ||
                transcriptData.transcript ||
                ""
            ).trim();

        if(!transcript){

            throw new Error(
                "No speech detected."
            );

        }

        const current =
            ensureCurrentChat();

        current.messages.push({

            role:"user",

            content:transcript

        });

        updateChatTitle(current);

        current.updatedAt =
            Date.now();

        saveHistory();

        renderChat();

        const recent =
            current.messages
                .slice(-MAX_CONTEXT)
                .map(m => ({

                    role:
                        m.role === "assistant"
                            ? "assistant"
                            : "user",

                    content:
                        String(
                            m.content || ""
                        )

                }));

        const response =
            await fetch(
                "/ask",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:transcript,

                        history:recent,

                        voice_mode:true,

                        timezone_offset_minutes:
                            new Date()
                                .getTimezoneOffset()

                    })

                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Voice answer failed"
            );

        }

        const answer =
            cleanAIText(
                data.answer ||
                data.response ||
                ""
            );

        if(!answer){

            throw new Error(
                "AI returned an empty voice answer."
            );

        }

        current.messages.push({

            role:"assistant",

            content:answer

        });

        current.updatedAt =
            Date.now();

        saveHistory();

        renderChat();

        setVoiceState(
            "speaking"
        );

        if(!isVoiceMuted){

            await speakVoiceAnswer(
                answer
            );

        }

        if(
            isVoiceMode &&
            !voiceStopRequested
        ){

            setVoiceState(
                "listening"
            );

            await startVoiceRecording();

        }else{

            setVoiceState(
                "ready"
            );

        }

    }catch(error){

        console.error(
            "VOICE ERROR:",
            error
        );

        setVoiceState(
            "interrupted"
        );

        showToast(
            error.message ||
            "Voice error"
        );

        setTimeout(() => {

            if(
                isVoiceMode
            ){

                setVoiceState(
                    "ready"
                );

            }

        },1800);

    }

}

function stopCurrentVoiceAudio(){

    if(currentVoiceAudio){

        try{

            currentVoiceAudio.pause();

            currentVoiceAudio.currentTime =
                0;

        }catch(e){}

        currentVoiceAudio = null;

    }

}

function makeAudioSource(
    value
){

    if(!value){

        return null;

    }

    const src =
        String(value);

    if(
        src.startsWith(
            "data:"
        )
    ){

        return src;

    }

    if(
        src.startsWith(
            "http://"
        ) ||
        src.startsWith(
            "https://"
        )
    ){

        return src;

    }

    return (
        "data:audio/wav;base64," +
        src
    );

}

async function speakVoiceAnswer(
    text
){

    if(!text){

        return;

    }

    stopCurrentVoiceAudio();

    try{

        const response =
            await fetch(
                "/tts",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        language:
                            detectLanguage(text)

                    })

                }
            );

        if(response.ok){

            const data =
                await response.json();

            if(
                Array.isArray(
                    data.audios
                ) &&
                data.audios.length > 0
            ){

                for(
                    const audioData
                    of data.audios
                ){

                    if(isVoiceMuted){

                        break;

                    }

                    const source =
                        makeAudioSource(
                            audioData
                        );

                    if(source){

                        await playAudioSource(
                            source
                        );

                    }

                }

                return;

            }

            if(data.audio){

                const source =
                    makeAudioSource(
                        data.audio
                    );

                if(source){

                    await playAudioSource(
                        source
                    );

                    return;

                }

            }

        }

    }catch(error){

        console.warn(
            "Backend TTS unavailable:",
            error
        );

    }

    if(
        "speechSynthesis" in window &&
        !isVoiceMuted
    ){

        await new Promise(
            resolve => {

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );

                utterance.lang =
                    detectLanguage(text);

                utterance.rate =
                    .95;

                utterance.onend =
                    resolve;

                utterance.onerror =
                    resolve;

                window.speechSynthesis.speak(
                    utterance
                );

            }
        );

    }

}

function playAudioSource(
    source
){

    return new Promise(
        resolve => {

            if(
                isVoiceMuted ||
                !source
            ){

                resolve();

                return;

            }

            const audio =
                new Audio(source);

            currentVoiceAudio =
                audio;

            let finished = false;

            const finish = () => {

                if(finished){

                    return;

                }

                finished = true;

                if(
                    currentVoiceAudio ===
                    audio
                ){

                    currentVoiceAudio =
                        null;

                }

                resolve();

            };

            audio.onended =
                finish;

            audio.onerror =
                finish;

            audio.onabort =
                finish;

            audio.play()
                .catch(
                    finish
                );

        }
    );

}

document.getElementById(
    "muteVoice"
).onclick = () => {

    isVoiceMuted =
        !isVoiceMuted;

    document.getElementById(
        "muteVoice"
    ).textContent =
        isVoiceMuted

            : "🔊";

    if(isVoiceMuted){

        window.speechSynthesis.cancel();

        stopCurrentVoiceAudio();

        showToast(
            "Voice muted"
        );

    }else{

        showToast(
            "Voice unmuted"
        );

    }

};

    "keydown",
    event => {

        if(
            event.key === "Enter"

                voiceTextInput.value.trim();

            if(!text){

                return;

            }

            voiceTextInput.value = "";

            closeVoiceMode();

            sendQuestion(text);

        }

    }
);
