<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Hello AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

header{
    height:58px;
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #222;
    background:#000;
    font-size:20px;
    font-weight:600;
}


/* =====================================================
   CHAT
===================================================== */

#chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 120px;
    scroll-behavior:smooth;
}

.message{
    max-width:850px;
    margin:0 auto 18px;
    padding:13px 15px;
    border-radius:18px;
    line-height:1.55;
    font-size:15px;
    word-wrap:break-word;
}

.user{
    background:#1f1f1f;
    margin-left:auto;
    margin-right:0;
    width:fit-content;
    max-width:85%;
}

.ai{
    background:#111;
    border:1px solid #202020;
    margin-left:0;
    margin-right:auto;
    max-width:90%;
}


/* =====================================================
   MARKDOWN
===================================================== */

.ai h1,
.ai h2,
.ai h3{
    margin-top:10px;
}

.ai p{
    margin:7px 0;
}

.ai ul,
.ai ol{
    padding-left:22px;
}

.ai li{
    margin:5px 0;
}

.ai code{
    background:#222;
    padding:2px 5px;
    border-radius:5px;
}

.ai pre{
    background:#050505;
    border:1px solid #282828;
    padding:12px;
    border-radius:10px;
    overflow-x:auto;
}

.ai table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

.ai th,
.ai td{
    border:1px solid #333;
    padding:7px;
    text-align:left;
}


/* =====================================================
   AI ACTION BUTTONS
===================================================== */

.actions{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px;
    margin-top:8px;
    opacity:.72;
}

.actionBtn{
    border:none;
    background:transparent;
    color:#888;
    border-radius:7px;
    padding:3px 5px;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    transition:
        background .15s ease,
        color .15s ease;
}

.actionBtn:hover{
    background:#1a1a1a;
    color:#ccc;
}

.actionBtn:active{
    background:#222;
    color:#fff;
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:10px;
    background:linear-gradient(
        transparent,
        #000 25%
    );
}

.inputBar{
    max-width:850px;
    margin:auto;
    height:52px;
    border:1px solid #333;
    border-radius:18px;
    background:#111;
    display:flex;
    align-items:center;
    padding:5px 7px;
    gap:7px;
}

.plusBtn,
.sendBtn,
.micBtn{
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    background:#202020;
    color:#fff;
    cursor:pointer;
    font-size:20px;
    flex-shrink:0;
}

.plusBtn:hover,
.sendBtn:hover,
.micBtn:hover{
    background:#2b2b2b;
}

#input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:15px;
}


/* =====================================================
   PLUS MENU
===================================================== */

#plusMenu{
    display:none;
    position:absolute;
    bottom:68px;
    left:calc(50% - 425px);
    width:180px;
    background:#151515;
    border:1px solid #333;
    border-radius:14px;
    padding:7px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.plusItem{
    width:100%;
    padding:11px;
    background:transparent;
    color:#fff;
    border:none;
    text-align:left;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
}

.plusItem:hover{
    background:#252525;
}


/* =====================================================
   HIDDEN INPUTS
===================================================== */

.hiddenInput{
    display:none;
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

.previewImage{
    max-width:100%;
    max-height:350px;
    border-radius:12px;
    margin-top:8px;
}


/* =====================================================
   VOICE SCREEN
===================================================== */

#voice{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.voiceClose{
    position:absolute;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #333;
    background:#151515;
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

#orb{
    width:130px;
    height:130px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff 0%,
        #777 30%,
        #222 60%,
        #000 100%
    );
    box-shadow:0 0 45px rgba(255,255,255,.25);
    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

#status{
    margin-top:28px;
    color:#bbb;
    font-size:15px;
}

#provider{
    margin-top:7px;
    color:#666;
    font-size:12px;
}

.voiceText{
    width:min(700px,90%);
    min-height:70px;
    margin-top:22px;
    padding:12px;
    border:1px solid #252525;
    border-radius:12px;
    background:#0d0d0d;
    color:#fff;
    resize:none;
    outline:none;
}

.voiceControls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:18px;
}

.voiceControl{
    padding:10px 15px;
    border-radius:12px;
    border:1px solid #333;
    background:#151515;
    color:#fff;
    cursor:pointer;
}

#stopRecordBtn{
    display:none;
}


/* =====================================================
   VOICE PICKER
===================================================== */

#voicePicker{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.voiceBox{
    width:min(600px,100%);
    max-height:80vh;
    overflow-y:auto;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:18px;
}

.voiceBox h3{
    margin-top:0;
}

.voiceSection{
    margin-top:18px;
}

.voiceOption{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    border:1px solid #292929;
    background:#171717;
    color:#fff;
    text-align:left;
    cursor:pointer;
}

.voiceOption:hover{
    background:#252525;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    #plusMenu{
        left:10px;
    }

}

@media(max-width:600px){

    header{
        height:54px;
        min-height:54px;
        font-size:18px;
    }

    #chat{
        padding:14px 10px 115px;
    }

    .message{
        font-size:14px;
    }

    .inputBar{
        height:50px;
        border-radius:16px;
    }

    .plusBtn,
    .sendBtn,
    .micBtn{
        width:38px;
        height:38px;
    }

    #input{
        font-size:14px;
    }

}

</style>

</head>


<body>


<div id="app">


<header>
    Hello AI
</header>


<div id="chat"></div>


<!-- =====================================================
     BOTTOM INPUT
===================================================== -->

<div class="bottom">

    <div id="plusMenu">

        <button
        class="plusItem"
        onclick="openCamera()">
            📷 Camera
        </button>

        <button
        class="plusItem"
        onclick="openGallery()">
            🖼️ Gallery
        </button>

        <button
        class="plusItem"
        onclick="openDocument()">
            📄 Document
        </button>

        <button
        class="plusItem"
        onclick="createImage()">
            🎨 Create Image
        </button>

    </div>


    <div class="inputBar">

        <button
        class="plusBtn"
        onclick="togglePlus()">
            +
        </button>


        <input
        id="input"
        type="text"
        placeholder="Ask Hello AI anything..."
        autocomplete="off"
        onkeydown="handleEnter(event)"
        />


        <button
        class="sendBtn"
        onclick="send()">
            ➤
        </button>


        <button
        class="micBtn"
        onclick="openVoice()">
            🎤
        </button>

    </div>

</div>


<!-- =====================================================
     FILE INPUTS
===================================================== -->

<input
    id="cameraInput"
    class="hiddenInput"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="imageFile(this)"
>

<input
    id="galleryInput"
    class="hiddenInput"
    type="file"
    accept="image/*"
    onchange="imageFile(this)"
>

<input
    id="documentInput"
    class="hiddenInput"
    type="file"
    accept=".pdf,.txt,.doc,.docx"
    onchange="docFile(this)"
>


<!-- =====================================================
     VOICE SCREEN
===================================================== -->

<div id="voice">

    <button
    class="voiceClose"
    onclick="closeVoice()">
        ×
    </button>


    <div id="orb"></div>


    <div id="status">
        Ready
    </div>


    <div id="provider"></div>


    <textarea
    id="voiceText"
    class="voiceText"
    readonly
    placeholder="Voice transcription will appear here..."
    ></textarea>


    <div class="voiceControls">

        <button
        class="voiceControl"
        id="stopRecordBtn"
        onclick="stopRecording()">
            🔴 Stop Recording
        </button>


        <button
        class="voiceControl"
        onclick="speakCurrent()">
            🔊 Speak
        </button>


        <button
        class="voiceControl"
        onclick="toggleMute()">
            🔇 Mute
        </button>


        <button
        class="voiceControl"
        onclick="openVoicePicker()">
            🎙️ Voice
        </button>

    </div>

</div>


<!-- =====================================================
     VOICE PICKER
===================================================== -->

<div id="voicePicker">

    <div class="voiceBox">

        <h3>
            Choose Voice
        </h3>


        <div class="voiceSection">

            <strong>
                Male Voices
            </strong>

            <div id="maleVoices"></div>

        </div>


        <div class="voiceSection">

            <strong>
                Female Voices
            </strong>

            <div id="femaleVoices"></div>

        </div>


        <button
        class="voiceControl"
        onclick="closeVoicePicker()">
            Close
        </button>

    </div>

</div>


</div>


<script>


/* =====================================================
   STATE
===================================================== */

let history = [];

let selectedVoice =
    localStorage.getItem("hello_ai_voice")
    || "shubh";

let recorder = null;
let chunks = [];
let stream = null;
let recording = false;
let muted = false;
let audioNow = null;

let recordingTimer = null;

let lastQuestion = "";
let lastAnswer = "";

let plusOpen = false;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");


/* =====================================================
   BASIC HELPERS
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function scrollChat(){

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   MARKDOWN
===================================================== */

function renderAIText(text){

    try{

        const html =
            marked.parse(text || "");

        return DOMPurify.sanitize(html);

    }catch(e){

        return escapeHTML(text || "");

    }
}


/* =====================================================
   NORMAL MESSAGE
===================================================== */

function msg(text,type="user"){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    scrollChat();

    return div;
}


/* =====================================================
   AI MESSAGE
===================================================== */

function addAIMessage(
    text,
    provider="gemini",
    animate=true
){

    const div =
        document.createElement("div");

    div.className =
        "message ai";

    const content =
        document.createElement("div");

    div.appendChild(content);

    chat.appendChild(div);

    scrollChat();


    if(!animate){

        content.innerHTML =
            renderAIText(text);

        addActions(
            div,
            text
        );

        return div;
    }


    let index = 0;

    const timer =
        setInterval(() => {

            if(index >= text.length){

                clearInterval(timer);

                content.innerHTML =
                    renderAIText(text);

                addActions(
                    div,
                    text
                );

                scrollChat();

                return;
            }


            content.textContent =
                text.substring(
                    0,
                    index + 1
                );

            index += 2;

            scrollChat();

        },12);


    return div;
}


/* =====================================================
   AI ACTION BUTTONS
===================================================== */

function addActions(
    container,
    text
){

    const actions =
        document.createElement("div");

    actions.className =
        "actions";


    const copy =
        createAction(
            "Copy",
            () => copyText(text)
        );


    const like =
        createAction(
            "Like",
            () => likeMessage(like)
        );


    const dislike =
        createAction(
            "Dislike",
            () => dislikeMessage(dislike)
        );


    const speakButton =
        createAction(
            "Speak",
            () => speak(text)
        );


    const regenerate =
        createAction(
            "Regenerate",
            () => regenerateAnswer()
        );


    const share =
        createAction(
            "Share",
            () => shareText(text)
        );


    actions.appendChild(copy);
    actions.appendChild(like);
    actions.appendChild(dislike);
    actions.appendChild(speakButton);
    actions.appendChild(regenerate);
    actions.appendChild(share);


    container.appendChild(actions);
}


function createAction(
    text,
    callback
){

    const button =
        document.createElement("button");

    button.className =
        "actionBtn";

    button.textContent =
        text;

    button.onclick =
        callback;

    return button;
}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

    }catch(e){

        const area =
            document.createElement("textarea");

        area.value =
            text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();
    }
}


/* =====================================================
   LIKE / DISLIKE
===================================================== */

function likeMessage(button){

    button.textContent =
        "Liked";
}


function dislikeMessage(button){

    button.textContent =
        "Noted";
}


/* =====================================================
   SEND
===================================================== */

async function send(){

    const q =
        input.value.trim();

    if(!q)
        return;


    lastQuestion =
        q;

    input.value = "";

    closePlus();


    msg(
        q,
        "user"
    );


    const thinking =
        msg(
            "Thinking...",
            "ai"
        );


    try{

        const response =
            await fetch(
                "/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:q,

                        history:history

                    })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        const answer =
            data.answer
            || data.response
            || data.error
            || "Sorry, I couldn't answer that.";


        lastAnswer =
            answer;


        history.push({

            role:"user",

            content:q

        });


        history.push({

            role:"assistant",

            content:answer

        });


        if(history.length > 30){

            history =
                history.slice(-30);

        }


        addAIMessage(
            answer,
            data.provider
            || data.model
            || "gemini"
        );


    }catch(error){

        console.log(
            "Send error:",
            error
        );


        thinking.remove();


        addAIMessage(
            "Something went wrong. Please try again.",
            "error"
        );
    }
}


/* =====================================================
   ENTER KEY
===================================================== */

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        send();
    }
}


/* =====================================================
   REGENERATE
===================================================== */

async function regenerateAnswer(){

    if(!lastQuestion)
        return;


    const thinking =
        msg(
            "Regenerating...",
            "ai"
        );


    try{

        const response =
            await fetch(
                "/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:lastQuestion,

                        history:history

                    })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        const answer =
            data.answer
            || data.response
            || data.error
            || "Sorry, I couldn't answer that.";


        lastAnswer =
            answer;


        history.push({

            role:"assistant",

            content:answer

        });


        if(history.length > 30){

            history =
                history.slice(-30);

        }


        addAIMessage(
            answer,
            data.provider
            || data.model
            || "gemini"
        );


    }catch(e){

        thinking.remove();


        addAIMessage(
            "Unable to regenerate the answer.",
            "error"
        );
    }
}


/* =====================================================
   SHARE
===================================================== */

async function shareText(text){

    try{

        if(navigator.share){

            await navigator.share({
                title:"Hello AI",
                text:text
            });

        }else{

            await navigator.clipboard.writeText(
                text
            );

            alert(
                "Answer copied to clipboard."
            );

        }

    }catch(e){

        console.log(e);
    }
}


/* =====================================================
   SPEAK
===================================================== */

async function speak(text){

    if(!text)
        return;


    if(audioNow){

        try{

            audioNow.pause();

        }catch(e){}

        audioNow = null;
    }


    try{

        const response =
            await fetch(
                "/tts",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        speaker:selectedVoice

                    })
                }
            );


        const data =
            await response.json();


        if(!data.audio){

            return;
        }


        audioNow =
            new Audio(
                "data:audio/wav;base64,"
                + data.audio
            );


        if(!muted){

            await audioNow.play();

        }

    }catch(e){

        console.log(
            "TTS error:",
            e
        );
    }
}


function speakCurrent(){

    if(lastAnswer){

        speak(lastAnswer);

    }

}


/* =====================================================
   PLUS MENU
===================================================== */

function togglePlus(){

    plusOpen =
        !plusOpen;


    document.getElementById(
        "plusMenu"
    ).style.display =
        plusOpen
        ? "block"
        : "none";
}


function closePlus(){

    plusOpen = false;


    document.getElementById(
        "plusMenu"
    ).style.display =
        "none";
}


/* =====================================================
   CAMERA
===================================================== */

function openCamera(){

    closePlus();


    document.getElementById(
        "cameraInput"
    ).click();
}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(){

    closePlus();


    document.getElementById(
        "galleryInput"
    ).click();
}


/* =====================================================
   DOCUMENT
===================================================== */

function openDocument(){

    closePlus();


    document.getElementById(
        "documentInput"
    ).click();
}


/* =====================================================
   CREATE IMAGE
===================================================== */

function createImage(){

    closePlus();


    msg(
        "Create Image is available in the existing interface.",
        "ai"
    );
}


/* =====================================================
   IMAGE FILE
===================================================== */

function imageFile(inputElement){

    const file =
        inputElement.files[0];

    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        async function(){

            const dataURL =
                reader.result;


            const image =
                document.createElement("img");

            image.src =
                dataURL;

            image.className =
                "previewImage";


            const userBox =
                document.createElement("div");

            userBox.className =
                "message user";

            userBox.appendChild(
                image
            );


            chat.appendChild(
                userBox
            );


            scrollChat();


            const thinking =
                msg(
                    "Analyzing image...",
                    "ai"
                );


            try{

                const response =
                    await fetch(
                        "/vision",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:JSON.stringify({

                                image:dataURL,

                                question:
                                    "এই ছবিটা দেখে বলো এখানে কী আছে। বিস্তারিতভাবে এবং সঠিকভাবে উত্তর দাও।"

                            })
                        }
                    );


                const data =
                    await response.json();


                thinking.remove();


                const answer =
                    data.answer
                    || data.response
                    || data.error
                    || "I couldn't analyze this image.";


                history.push({

                    role:"user",

                    content:
                        "[Image uploaded]"

                });


                history.push({

                    role:"assistant",

                    content:answer

                });


                if(history.length > 30){

                    history =
                        history.slice(-30);

                }


                addAIMessage(
                    answer,
                    data.provider
                    || data.model
                    || "gemini-vision"
                );


            }catch(e){

                thinking.remove();


                addAIMessage(
                    "I couldn't analyze the image right now.",
                    "error"
                );
            }
        };


    reader.readAsDataURL(file);

    inputElement.value = "";
}


/* =====================================================
   DOCUMENT FILE
===================================================== */

function docFile(inputElement){

    const file =
        inputElement.files[0];

    if(!file)
        return;


    msg(
        "Document selected: " + file.name,
        "user"
    );


    addAIMessage(
        "The document was selected. Document processing is not enabled in the current backend yet.",
        "system"
    );


    inputElement.value = "";
}


/* =====================================================
   VOICE
===================================================== */

async function openVoice(){

    if(recording){
        return;
    }


    document.getElementById(
        "voice"
    ).style.display =
        "flex";


    document.getElementById(
        "status"
    ).textContent =
        "Starting microphone...";


    document.getElementById(
        "provider"
    ).textContent =
        "";


    document.getElementById(
        "voiceText"
    ).value =
        "";


    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }

            });


        startRecording();

    }catch(e){

        console.log(
            "Microphone error:",
            e
        );


        document.getElementById(
            "status"
        ).textContent =
            "Microphone permission is required.";
    }
}


function closeVoice(){

    stopRecording();


    if(stream){

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }


    if(audioNow){

        try{

            audioNow.pause();

        }catch(e){}

        audioNow = null;
    }


    document.getElementById(
        "stopRecordBtn"
    ).style.display =
        "none";


    document.getElementById(
        "voice"
    ).style.display =
        "none";
}


/* =====================================================
   RECORDING
===================================================== */

function startRecording(){

    if(!stream)
        return;


    if(recording)
        return;


    chunks = [];


    try{

        recorder =
            new MediaRecorder(stream);

    }catch(e){

        document.getElementById(
            "status"
        ).textContent =
            "Audio recording is not supported.";

        return;
    }


    recorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size > 0
            ){

                chunks.push(
                    event.data
                );

            }

        };


    recorder.onstop =
        async () => {

            const recordedChunks =
                chunks.slice();

            chunks = [];


            if(recordedChunks.length === 0){

                document.getElementById(
                    "status"
                ).textContent =
                    "No audio recorded.";

                return;
            }


            const blob =
                new Blob(
                    recordedChunks,
                    {
                        type:
                            recorder.mimeType
                            || "audio/webm"
                    }
                );


            await sendAudio(blob);
        };


    recorder.start();

    recording = true;


    document.getElementById(
        "status"
    ).textContent =
        "Listening...";


    document.getElementById(
        "provider"
    ).textContent =
        "Speak now, then press Stop Recording";


    document.getElementById(
        "stopRecordBtn"
    ).style.display =
        "block";


    if(recordingTimer){

        clearTimeout(
            recordingTimer
        );

        recordingTimer = null;
    }


    recordingTimer =
        setTimeout(() => {

            if(recording){

                stopRecording();

            }

        },60000);
}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

    if(!recorder || !recording){

        return;
    }


    recording = false;


    if(recordingTimer){

        clearTimeout(
            recordingTimer
        );

        recordingTimer = null;
    }


    document.getElementById(
        "stopRecordBtn"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).textContent =
        "Processing...";


    try{

        recorder.stop();

    }catch(e){

        console.log(
            "Recorder stop error:",
            e
        );
    }
}


/* =====================================================
   SEND AUDIO
===================================================== */

async function sendAudio(blob){

    try{

        const formData =
            new FormData();


        formData.append(
            "audio",
            blob,
            "voice.webm"
        );


        const response =
            await fetch(
                "/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(!data.text){

            document.getElementById(
                "status"
            ).textContent =
                data.error
                || "No speech detected.";


            document.getElementById(
                "provider"
            ).textContent =
                "";


            return;
        }


        const text =
            data.text.trim();


        document.getElementById(
            "voiceText"
        ).value =
            text;


        document.getElementById(
            "provider"
        ).textContent =
            "Gemini transcription";


        await voiceAsk(text);


    }catch(e){

        console.log(
            "Voice processing error:",
            e
        );


        document.getElementById(
            "status"
        ).textContent =
            "Voice processing failed.";
    }
}


/* =====================================================
   VOICE ASK
   GEMINI ONLY
===================================================== */

async function voiceAsk(text){

    try{

        document.getElementById(
            "status"
        ).textContent =
            "Thinking...";


        const response =
            await fetch(
                "/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        question:text,

                        history:history,

                        voice_mode:true

                    })
                }
            );


        const data =
            await response.json();


        const answer =
            data.answer
            || data.response
            || data.error
            || "Sorry, I couldn't answer that.";


        lastQuestion =
            text;


        lastAnswer =
            answer;


        history.push({

            role:"user",

            content:text

        });


        history.push({

            role:"assistant",

            content:answer

        });


        if(history.length > 30){

            history =
                history.slice(-30);

        }


        document.getElementById(
            "status"
        ).textContent =
            "Gemini answer";


        document.getElementById(
            "provider"
        ).textContent =
            "Gemini";


        addAIMessage(
            answer,
            data.provider
            || data.model
            || "gemini"
        );


        if(!muted){

            await speak(answer);

        }


    }catch(e){

        console.log(
            "Voice AI error:",
            e
        );


        document.getElementById(
            "status"
        ).textContent =
            "Unable to get an AI answer.";
    }
}
