<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hello AI</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;background:#000}

header{
 height:58px;flex:none;display:flex;align-items:center;
 justify-content:center;border-bottom:1px solid #222;
 font-size:20px;font-weight:bold
}

#chat{
 flex:1;overflow-y:auto;padding:18px 12px 95px;
 scroll-behavior:smooth
}

.message{
 max-width:85%;margin:9px 0;padding:11px 14px;
 border-radius:17px;line-height:1.45;
 white-space:pre-wrap;word-wrap:break-word
}
.user{margin-left:auto;background:#252525}
.ai{margin-right:auto;background:#111;border:1px solid #252525}

.message img{
 max-width:100%;max-height:300px;border-radius:12px
}

.actions{
 display:flex;gap:5px;flex-wrap:wrap;margin-top:8px
}
.actions button{
 background:#1d1d1d;color:#ddd;border:1px solid #333;
 border-radius:9px;padding:5px 8px;font-size:12px
}

.typing{opacity:.6;font-style:italic}

#bottom{
 position:fixed;left:0;right:0;bottom:0;
 padding:10px 10px calc(10px + env(safe-area-inset-bottom));
 background:#000;border-top:1px solid #222;
 display:flex;gap:7px;z-index:20
}

#bottom input{
 flex:1;min-width:0;background:#181818;color:#fff;
 border:1px solid #333;border-radius:24px;
 padding:12px 15px;outline:none
}

#bottom button{
 width:45px;height:45px;border:0;border-radius:50%;
 background:#202020;color:#fff;font-size:19px
}

#send{background:#fff!important;color:#000!important}

#plusMenu{
 display:none;position:fixed;left:10px;bottom:68px;
 background:#151515;border:1px solid #333;border-radius:14px;
 padding:8px;z-index:30
}
#plusMenu button{
 display:block;width:150px;background:#202020;color:#fff;
 border:0;border-radius:9px;padding:10px;margin:4px 0;text-align:left
}

input[type=file]{display:none}

/* VOICE SCREEN */
#voiceScreen{
 display:none;position:fixed;inset:0;z-index:50;
 background:#000;flex-direction:column;align-items:center;
 justify-content:center;padding:20px
}

#closeVoice{
 position:absolute;right:18px;top:18px;
 background:#222;color:#fff;border:0;
 width:42px;height:42px;border-radius:50%;font-size:20px
}

#orb{
 width:145px;height:145px;border-radius:50%;
 background:radial-gradient(circle,#fff,#555,#111);
 box-shadow:0 0 50px #555;
 animation:pulse 2s infinite;
 margin-bottom:25px
}
@keyframes pulse{
 50%{transform:scale(1.08);box-shadow:0 0 80px #777}
}

#voiceStatus{font-size:15px;opacity:.75;margin:8px;text-align:center}
#voiceText{
 max-width:90%;text-align:center;line-height:1.5;
 min-height:24px
}

.voice-controls{
 display:flex;gap:8px;flex-wrap:wrap;
 justify-content:center;margin-top:20px
}
.voice-controls button{
 background:#202020;color:#fff;border:1px solid #333;
 border-radius:12px;padding:10px 15px
}

/* VOICE PICKER */
#voicePicker{
 display:none;position:fixed;inset:0;z-index:60;
 background:#080808;overflow-y:auto;padding:65px 14px 30px
}

#closePicker{
 position:absolute;right:15px;top:15px;
 background:#222;color:#fff;border:0;
 width:42px;height:42px;border-radius:50%;font-size:20px
}

.voice-title{
 font-size:19px;font-weight:bold;margin:10px 0
}

.voice-item{
 display:flex;align-items:center;gap:7px;
 padding:8px;background:#151515;
 border:1px solid #292929;border-radius:10px;
 margin:6px 0
}
.voice-item.selected{border-color:#fff}
.voice-name{flex:1;font-size:14px}
.preview-btn,.select-btn{
 background:#222;color:#fff;border:1px solid #444;
 border-radius:8px;padding:7px 9px;font-size:12px
}

@media(max-width:600px){
 header{height:54px;font-size:19px}
 #chat{padding:12px 8px 90px}
 .message{max-width:91%;font-size:15px}
 #bottom{padding:8px}
 #bottom input{font-size:15px}
 #bottom button{width:43px;height:43px}
 #orb{width:125px;height:125px}
 .voice-item{gap:5px}
 .preview-btn,.select-btn{padding:7px 6px}
}

@media(max-width:380px){
 .voice-name{font-size:12px}
 .preview-btn,.select-btn{font-size:11px}
 #bottom button{width:40px;height:40px}
}

@media(max-height:500px) and (orientation:landscape){
 #orb{width:85px;height:85px;margin-bottom:10px}
}
</style>
</head>

<body>

<div id="app">

<header>Hello AI</header>

<div id="chat"></div>

<div id="bottom">
<button onclick="togglePlus()">+</button>
<input id="messageInput" placeholder="Ask Hello AI anything..." onkeydown="if(event.key==='Enter')send()">
<button id="send" onclick="send()">➤</button>
<button onclick="openVoice()">🎤</button>
</div>

<div id="plusMenu">
<button onclick="camera()">📷 Camera</button>
<button onclick="gallery()">🖼️ Gallery</button>
<button onclick="documentFile()">📄 Document</button>
</div>

<input id="cameraInput" type="file" accept="image/*" capture="environment" onchange="imageFile(this)">
<input id="galleryInput" type="file" accept="image/*" onchange="imageFile(this)">
<input id="documentInput" type="file" onchange="docFile(this)">

<!-- VOICE -->
<div id="voiceScreen">

<button id="closeVoice" onclick="closeVoice()">✕</button>

<div id="orb"></div>

<div id="voiceStatus">Press Speak to talk</div>
<div id="voiceText"></div>

<div class="voice-controls">
<button id="voiceMic" onclick="recordToggle()">🎙️ Speak</button>
<button onclick="mute()">🔇 Mute</button>
<button onclick="openPicker()">🎙️ Voice</button>
</div>

</div>

<!-- VOICE PICKER -->
<div id="voicePicker">

<button id="closePicker" onclick="closePicker()">✕</button>

<div class="voice-title">Male Voices</div>
<div id="maleVoices"></div>

<div class="voice-title">Female Voices</div>
<div id="femaleVoices"></div>

</div>

</div>

<script>

let history=[];
let selectedVoice=localStorage.getItem("helloAI_voice")||"shubh";
let recorder=null,chunks=[],stream=null;
let recording=false,muted=false,audioNow=null;
let lastQuestion="";

/* MESSAGE */

function msg(text,type){
 let d=document.createElement("div");
 d.className="message "+type;
 d.textContent=text;
 document.getElementById("chat").appendChild(d);
 scrollChat();
 return d;
}

function scrollChat(){
 let c=document.getElementById("chat");
 c.scrollTop=c.scrollHeight;
}

/* SEND */

async function send(){

 let input=document.getElementById("messageInput");
 let q=input.value.trim();
 if(!q)return;

 input.value="";
 lastQuestion=q;

 msg(q,"user");

 let loading=msg("Thinking...","ai");

 try{

  let r=await fetch("/ask",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    question:q,
    history:history
   })
  });

  let d=await r.json();

  loading.remove();

  if(!r.ok){
   msg(d.error||"Something went wrong.","ai");
   return;
  }

  let answer=d.answer||d.response||"";

  history.push({role:"user",content:q});
  history.push({role:"assistant",content:answer});

  addAIMessage(answer);

 }catch(e){

  console.error(e);
  loading.remove();
  msg("Connection error.","ai");
 }
}

/* AI MESSAGE */

function addAIMessage(text){

 let box=document.createElement("div");
 box.className="message ai";

 let content=document.createElement("div");
 content.textContent=text;

 let actions=document.createElement("div");
 actions.className="actions";

 actions.innerHTML=`
 <button onclick="copyText(this)">Copy</button>
 <button onclick="this.textContent='👍'">Like</button>
 <button onclick="this.textContent='👎'">Dislike</button>
 <button onclick="speak(this.parentElement.parentElement.querySelector('div').textContent)">🔊 Speak</button>
 <button onclick="regenerate()">↻ Regenerate</button>
 <button onclick="share(this.parentElement.parentElement.querySelector('div').textContent)">Share</button>
 `;

 box.appendChild(content);
 box.appendChild(actions);

 document.getElementById("chat").appendChild(box);
 scrollChat();
}

/* COPY */

function copyText(btn){

 let text=btn.parentElement.parentElement
   .querySelector("div").textContent;

 navigator.clipboard.writeText(text);
 btn.textContent="Copied";
 setTimeout(()=>btn.textContent="Copy",1200);
}

/* SPEAK */

async function speak(text){

 try{

  let r=await fetch("/tts",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    text:text,
    speaker:selectedVoice
   })
  });

  let d=await r.json();

  if(!r.ok||!d.audio){
   console.error(d);
   return;
  }

  if(audioNow){
   audioNow.pause();
   audioNow.currentTime=0;
  }

  audioNow=new Audio(
   "data:audio/wav;base64,"+d.audio
  );

  await audioNow.play();

 }catch(e){
  console.error("TTS ERROR:",e);
 }
}

/* SHARE */

async function share(text){

 try{

  if(navigator.share){
   await navigator.share({
    title:"Hello AI",
    text:text
   });
  }else{
   await navigator.clipboard.writeText(text);
   alert("Answer copied.");
  }

 }catch(e){}
}

/* REGENERATE */

async function regenerate(){

 if(!lastQuestion)return;

 let loading=msg("Regenerating...","ai");

 try{

  let r=await fetch("/ask",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    question:lastQuestion,
    history:history
   })
  });

  let d=await r.json();

  loading.remove();

  if(!r.ok){
   msg(d.error||"Failed.","ai");
   return;
  }

  let answer=d.answer||d.response||"";

  history.push({
   role:"assistant",
   content:answer
  });

  addAIMessage(answer);

 }catch(e){

  loading.remove();
  msg("Connection error.","ai");
 }
}

/* PLUS */

function togglePlus(){

 let m=document.getElementById("plusMenu");

 m.style.display=
  m.style.display==="block"
  ?"none":"block";
}

/* CAMERA */

function camera(){

 document.getElementById("plusMenu").style.display="none";
 document.getElementById("cameraInput").click();
}

/* GALLERY */

function gallery(){

 document.getElementById("plusMenu").style.display="none";
 document.getElementById("galleryInput").click();
}

/* DOCUMENT */

function documentFile(){

 document.getElementById("plusMenu").style.display="none";
 document.getElementById("documentInput").click();
}

/* IMAGE */

async function imageFile(input){

 let file=input.files&&input.files[0];
 if(!file)return;

 msg("🖼️ "+file.name,"user");

 let reader=new FileReader();

 reader.onload=async function(){

  let dataUrl=reader.result;

  let imgBox=document.createElement("div");
  imgBox.className="message user";

  let img=document.createElement("img");
  img.src=dataUrl;

  imgBox.appendChild(img);
  document.getElementById("chat").appendChild(imgBox);
  scrollChat();

  let loading=msg("Image বুঝছি...","ai");

  try{

   let r=await fetch("/vision",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     image:dataUrl,
     question:"এই ছবিটা দেখে বলো এখানে কী আছে।"
    })
   });

   let d=await r.json();

   loading.remove();

   if(!r.ok){
    msg(d.error||"Image analysis failed.","ai");
    return;
   }

   addAIMessage(
    d.answer||d.response||"Image বুঝতে পারিনি."
   );

  }catch(e){

   loading.remove();
   msg("Image analysis failed.","ai");
  }
 };

 reader.readAsDataURL(file);
 input.value="";
}

/* DOCUMENT */

function docFile(input){

 let file=input.files&&input.files[0];
 if(!file)return;

 msg("📄 "+file.name,"user");

 msg(
  "Document selected: "+file.name,
  "ai"
 );

 input.value="";
}

/* VOICE SCREEN */

function openVoice(){

 document.getElementById("voiceScreen").style.display="flex";

 document.getElementById("voiceStatus")
 .textContent="Press Speak to talk";

 document.getElementById("voiceText")
 .textContent="";
}

function closeVoice(){

 if(recording)stopRecording();

 document.getElementById("voiceScreen").style.display="none";
}

/* RECORD */

function recordToggle(){

 recording?stopRecording():startRecording();
}

async function startRecording(){

 try{

  if(muted){
   document.getElementById("voiceStatus")
   .textContent="Microphone is muted.";
   return;
  }

  stream=await navigator.mediaDevices.getUserMedia({
   audio:true
  });

  recorder=new MediaRecorder(stream);
  chunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=sendVoice;
  recorder.start();

  recording=true;

  document.getElementById("voiceMic")
  .textContent="⏹️ Stop";

  document.getElementById("voiceStatus")
  .textContent="Listening...";

 }catch(e){

  alert("Microphone permission দিন.");
 }
}

function stopRecording(){

 if(!recorder)return;

 if(recorder.state!=="inactive")
  recorder.stop();

 if(stream)
  stream.getTracks().forEach(t=>t.stop());

 recording=false;

 document.getElementById("voiceMic")
 .textContent="🎙️ Speak";

 document.getElementById("voiceStatus")
 .textContent="Processing...";
}

/* SEND VOICE */

async function sendVoice(){

 try{

  let blob=new Blob(chunks,{
   type:recorder&&recorder.mimeType
   ?recorder.mimeType:"audio/webm"
  });

  let form=new FormData();
  form.append("audio",blob,"voice.webm");

  let r=await fetch("/transcribe",{
   method:"POST",
   body:form
  });

  let d=await r.json();

  if(!r.ok)
   throw new Error(d.error||"Transcription failed");

  let text=d.text||d.transcript||"";

  if(!text.trim()){

   document.getElementById("voiceStatus")
   .textContent="No speech detected.";

   return;
  }

  document.getElementById("voiceText")
  .textContent="You: "+text;

  await voiceAsk(text);

 }catch(e){

  console.error(e);

  document.getElementById("voiceStatus")
  .textContent="Voice processing failed.";
 }
}

/* VOICE ASK */

async function voiceAsk(text){

 try{

  document.getElementById("voiceStatus")
  .textContent="Hello AI is thinking...";

  let r=await fetch("/ask",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    question:text,
    history:history
   })
  });

  let d=await r.json();

  if(!r.ok)
   throw new Error(d.error||"AI failed");

  let answer=d.answer||d.response||"";

  history.push({
   role:"user",
   content:text
  });

  history.push({
   role:"assistant",
   content:answer
  });

  lastQuestion=text;

  document.getElementById("voiceText")
  .textContent="Hello AI: "+answer;

  document.getElementById("voiceStatus")
  .textContent="Speaking...";

  await speak(answer);

  document.getElementById("voiceStatus")
  .textContent="Press Speak to talk";

 }catch(e){

  console.error(e);

  document.getElementById("voiceStatus")
  .textContent="AI response failed.";
 }
}

/* MUTE */

function mute(){

 muted=!muted;

 let buttons=
  document.querySelectorAll(".voice-controls button");

 let b=buttons[1];

 if(muted){

  b.textContent="🎤 Unmute";

  document.getElementById("voiceStatus")
  .textContent="Microphone muted.";

 }else{

  b.textContent="🔇 Mute";

  document.getElementById("voiceStatus")
  .textContent="Microphone ready.";
 }
}

/* VOICE PICKER */

function openPicker(){

 document.getElementById("voicePicker")
 .style.display="block";

 loadVoices();
}

function closePicker(){

 document.getElementById("voicePicker")
 .style.display="none";
}

function loadVoices(){

 let male=document.getElementById("maleVoices");
 let female=document.getElementById("femaleVoices");

 male.innerHTML="";
 female.innerHTML="";

 [
  "shubh","aditya","rahul","rohan",
  "amit","dev","ratan","varun",
  "manan","sumit","kabir","aayan"
 ].forEach(v=>createVoice(v,male));

 [
  "ritu","priya","neha","pooja",
  "simran","kavya","ishita","shreya",
  "roopa","tanya","shruti","suhani"
 ].forEach(v=>createVoice(v,female));
}

/* CREATE VOICE */

function createVoice(name,parent){

 let row=document.createElement("div");

 row.className=
  "voice-item"+
  (selectedVoice===name?" selected":"");

 row.innerHTML=`
  <span class="voice-name">${name}</span>
  <button class="preview-btn">▶ Preview</button>
  <button class="select-btn">
   ${selectedVoice===name?"✓ Selected":"Select"}
  </button>
 `;

 row.querySelector(".preview-btn").onclick=e=>{
  e.preventDefault();
  e.stopPropagation();
  previewVoice(name);
 };

 row.querySelector(".select-btn").onclick=e=>{
  e.preventDefault();
  e.stopPropagation();

  selectedVoice=name;

  localStorage.setItem(
   "helloAI_voice",
   selectedVoice
  );

  loadVoices();
 };

 parent.appendChild(row);
}

/* PREVIEW */

async function previewVoice(name){

 try{

  document.getElementById("voiceStatus")
  .textContent="Loading "+name+" voice...";

  if(audioNow){
   audioNow.pause();
   audioNow.currentTime=0;
  }

  let r=await fetch("/tts",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    text:"Hello, I am your AI voice. Nice to meet you.",
    speaker:name
   })
  });

  let d=await r.json();

  if(!r.ok){
   alert(d.error||"Voice preview failed.");
   return;
  }

  if(!d.audio){
   alert("Voice audio পাওয়া যায়নি.");
   return;
  }

  audioNow=new Audio(
   "data:audio/wav;base64,"+d.audio
  );

  audioNow.onended=()=>{
   document.getElementById("voiceStatus")
   .textContent="Press Speak to talk";
  };

  await audioNow.play();

  document.getElementById("voiceStatus")
  .textContent="Playing "+name+"...";

 }catch(e){

  console.error(e);

  alert("Voice preview চালু করা যাচ্ছে না.");
 }
}

/* START */

loadVoices();

</script>
</body>
</html>
