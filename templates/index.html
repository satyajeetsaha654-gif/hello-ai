<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:22px;
  font-size:28px;
  font-weight:bold;
}

.chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  max-width:80%;
  padding:11px 15px;
  margin:10px 0;
  border-radius:18px;
  line-height:1.5;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.user-message{
  margin-left:auto;
  background:#333;
}

.ai-message{
  margin-right:auto;
  background:#222;
}

.bar{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  background:#111;
}

.bar input{
  flex:1;
  padding:14px 16px;
  border:1px solid #444;
  border-radius:25px;
  background:#222;
  color:#fff;
  outline:none;
  font-size:15px;
}

.bar button{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  font-size:21px;
}

#plus{
  background:#333;
  color:#fff;
}

#send{
  background:#fff;
  color:#000;
}

#mic{
  background:#333;
  color:#fff;
}

#plusMenu{
  position:absolute;
  left:12px;
  bottom:70px;
  width:210px;
  padding:8px;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:16px;
  display:none;
  box-shadow:0 10px 30px #000;
  z-index:500;
}

.option{
  width:100%;
  height:50px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  background:#333;
}

.icon{
  font-size:23px;
}

#voice{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#close{
  position:absolute;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:20px;
}

#orb{
  width:170px;
  height:170px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#555,#111);
  box-shadow:0 0 50px #777;
  margin-bottom:30px;
}

#status{
  font-size:20px;
  margin-bottom:15px;
}

#voiceText{
  width:90%;
  max-width:900px;
  height:45vh;
  overflow-y:auto;
  text-align:center;
  font-size:19px;
  line-height:1.6;
  padding:20px;
  white-space:pre-wrap;
  word-wrap:break-word;
  scroll-behavior:smooth;
}

#voiceMic{
  margin-top:30px;
  width:75px;
  height:75px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:28px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app">

  <header>Hello AI</header>

  <div id="chat" class="chat"></div>

  <div class="bar">

    <button type="button" id="plus">+</button>

    <div id="plusMenu">

      <button type="button" class="option" id="cameraBtn">
        <span class="icon">📷</span>
        <span>Camera</span>
      </button>

      <button type="button" class="option" id="galleryBtn">
        <span class="icon">🖼️</span>
        <span>Gallery</span>
      </button>

      <button type="button" class="option" id="documentBtn">
        <span class="icon">📄</span>
        <span>Document</span>
      </button>

    </div>

    <input
      id="question"
      type="text"
      placeholder="Ask Hello AI anything..."
    >

    <button type="button" id="send">➤</button>

    <button type="button" id="mic">🎤</button>

  </div>

</div>


<input
  id="galleryInput"
  type="file"
  accept="image/*"
  hidden
>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
>

<input
  id="documentInput"
  type="file"
  accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
  hidden
>


<!-- =========================
     VOICE SCREEN
========================= -->

<div id="voice">

  <button type="button" id="close">✕</button>

  <div id="orb"></div>

  <div id="status">Tap microphone</div>

  <div id="voiceText"></div>

  <button type="button" id="voiceMic">🎤</button>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const question = document.getElementById("question");
const send = document.getElementById("send");
const mic = document.getElementById("mic");

const plus = document.getElementById("plus");
const plusMenu = document.getElementById("plusMenu");
const chat = document.getElementById("chat");

const galleryInput =
  document.getElementById("galleryInput");

const cameraInput =
  document.getElementById("cameraInput");

const documentInput =
  document.getElementById("documentInput");

const voice =
  document.getElementById("voice");

const close =
  document.getElementById("close");

const voiceMic =
  document.getElementById("voiceMic");

const status =
  document.getElementById("status");

const voiceText =
  document.getElementById("voiceText");


let recorder = null;
let chunks = [];

let answerTimer = null;


/* =========================
   CLEAN TEXT
========================= */

function cleanDisplayText(text){

  if(!text){
    return "";
  }

  let clean = String(text);

  /*
     Remove repeated stars
     Example:
     *****answer*****
  */

  clean = clean.replace(/\*{2,}/g,"");


  /*
     Remove repeated slashes
  */

  clean = clean.replace(/\/{2,}/g,"");


  /*
     Remove repeated underscores
  */

  clean = clean.replace(/_{2,}/g,"");


  /*
     Remove Markdown bold markers
  */

  clean = clean.replace(/\*\*/g,"");
  clean = clean.replace(/__/g,"");


  /*
     Remove unnecessary spaces
  */

  clean = clean.replace(
    /[ \t]{2,}/g,
    " "
  );


  /*
     Keep normal paragraph spacing
  */

  clean = clean.replace(
    /\n{3,}/g,
    "\n\n"
  );


  return clean.trim();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText =
    cleanDisplayText(text);

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   PLUS MENU
========================= */

plus.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    if(
      plusMenu.style.display ===
      "block"
    ){

      plusMenu.style.display =
        "none";

    }else{

      plusMenu.style.display =
        "block";

    }

  }
);


document.addEventListener(
  "click",
  function(e){

    if(
      !plusMenu.contains(e.target) &&
      e.target !== plus
    ){

      plusMenu.style.display =
        "none";

    }

  }
);


/* =========================
   GALLERY
========================= */

document.getElementById(
  "galleryBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    galleryInput.click();

  }
);


galleryInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Selected image: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   CAMERA
========================= */

document.getElementById(
  "cameraBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    cameraInput.click();

  }
);


cameraInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Camera photo: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   DOCUMENT
========================= */

document.getElementById(
  "documentBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    documentInput.click();

  }
);


documentInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Document: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   ASK AI
========================= */

async function askAI(text){

  try{

    const response =
      await fetch(
        "/ask",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question:text
          })
        }
      );


    const data =
      await response.json();


    if(data.error){

      addMessage(
        "Error: " +
        data.error,
        "ai-message"
      );

      return null;
    }


    return cleanDisplayText(
      data.answer
    );


  }catch(error){

    addMessage(
      "Connection error: " +
      error.message,
      "ai-message"
    );

    return null;
  }

}


/* =========================
   SEND MESSAGE
========================= */

send.addEventListener(
  "click",
  async function(){

    const text =
      question.value.trim();


    if(!text){
      return;
    }


    addMessage(
      text,
      "user-message"
    );


    question.value =
      "";


    const thinking =
      document.createElement(
        "div"
      );


    thinking.className =
      "message ai-message";


    thinking.innerText =
      "Thinking...";


    chat.appendChild(
      thinking
    );


    const answer =
      await askAI(text);


    if(thinking.parentNode){

      thinking.remove();

    }


    if(answer){

      addMessage(
        answer,
        "ai-message"
      );

    }

  }
);


/* =========================
   ENTER KEY
========================= */

question.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      send.click();

    }

  }
);


/* =========================
   OPEN VOICE
========================= */

mic.addEventListener(
  "click",
  function(){

    speechSynthesis.cancel();


    if(answerTimer){

      clearInterval(answerTimer);

      answerTimer = null;

    }


    voice.style.display =
      "flex";


    voiceText.innerText =
      "";


    status.innerText =
      "Tap microphone";

  }
);


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  try{

    speechSynthesis.cancel();


    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }

      });


    chunks = [];


    recorder =
      new MediaRecorder(
        stream
      );


    recorder.ondataavailable =
      function(e){

        if(
          e.data &&
          e.data.size > 0
        ){

          chunks.push(
            e.data
          );

        }

      };


    recorder.onstop =
      sendAudio;


    status.innerText =
      "Listening...";


    voiceText.innerText =
      "Speak now";


    voiceMic.innerText =
      "⏹";


    recorder.start();


  }catch(error){

    status.innerText =
      "Microphone error";


    voiceText.innerText =
      error.message;

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  if(!recorder){
    return;
  }


  if(
    recorder.state ===
    "recording"
  ){

    recorder.stop();

  }


  if(recorder.stream){

    recorder.stream
    .getTracks()
    .forEach(
      function(track){

        track.stop();

      }
    );

  }


  voiceMic.innerText =
    "🎤";


  status.innerText =
    "Processing...";

}


/* =========================
   VOICE BUTTON
========================= */

voiceMic.addEventListener(
  "click",
  function(){

    if(
      recorder &&
      recorder.state ===
      "recording"
    ){

      stopRecording();

    }else{

      startRecording();

    }

  }
);


/* =========================
   SEND AUDIO
========================= */

async function sendAudio(){

  try{

    if(chunks.length === 0){

      status.innerText =
        "No audio";


      voiceText.innerText =
        "Please speak again.";

      return;
    }


    const blob =
      new Blob(
        chunks,
        {
          type:
            "audio/webm"
        }
      );


    const form =
      new FormData();


    form.append(
      "audio",
      blob,
      "voice-" +
      Date.now() +
      ".webm"
    );


    status.innerText =
      "Converting voice...";


    const response =
      await fetch(
        "/transcribe",
        {
          method:"POST",
          body:form
        }
      );


    const data =
      await response.json();


    if(data.error){

      status.innerText =
        "Error";


      voiceText.innerText =
        data.error;

      return;
    }


    const text =
      (data.text || "")
      .trim();


    if(!text){

      status.innerText =
        "No speech detected";


      voiceText.innerText =
        "Please speak again.";

      return;
    }


    voiceText.innerText =
      cleanDisplayText(text);


    status.innerText =
      "Thinking...";


    await voiceAsk(text);


  }catch(error){

    status.innerText =
      "Error";


    voiceText.innerText =
      error.message;

  }

}


/* =========================
   DETECT LANGUAGE
========================= */

function detectLanguage(text){

  /*
     Bengali
  */

  if(
    /[\u0980-\u09FF]/.test(text)
  ){

    return "bn-IN";

  }


  /*
     Hindi / Devanagari
  */

  if(
    /[\u0900-\u097F]/.test(text)
  ){

    return "hi-IN";

  }


  /*
     Default English
  */

  return "en-IN";
}


/* =========================
   SHOW ANSWER CHARACTER BY
   CHARACTER
========================= */

function showAnswerSlowly(answer){

  if(answerTimer){

    clearInterval(
      answerTimer
    );

    answerTimer = null;

  }


  voiceText.innerText =
    "";


  let index = 0;


  /*
     Speed of text display.
     Smaller number = faster.
  */

  const speed = 35;


  answerTimer =
    setInterval(
      function(){

        if(index >= answer.length){

          clearInterval(
            answerTimer
          );

          answerTimer = null;

          voiceText.scrollTop =
            voiceText.scrollHeight;

          return;

        }


        voiceText.innerText +=
          answer[index];


        index++;


        /*
           Automatic scrolling
        */

        voiceText.scrollTop =
          voiceText.scrollHeight;

      },
      speed
    );

}


/* =========================
   VOICE ASK AI
========================= */

async function voiceAsk(text){

  try{

    const response =
      await fetch(
        "/ask",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question:text
          })
        }
      );


    const data =
      await response.json();


    if(data.error){

      status.innerText =
        "AI error";


      voiceText.innerText =
        data.error;

      return;

    }


    const answer =
      cleanDisplayText(
        data.answer ||
        "No answer"
      );


    status.innerText =
      "Hello AI";


    /*
       Show answer gradually
    */

    showAnswerSlowly(
      answer
    );


    /*
       Detect language
    */

    const language =
      detectLanguage(
        answer
      );


    /*
       Text to speech
    */

    const speech =
      new SpeechSynthesisUtterance(
        answer
      );


    speech.lang =
      language;


    speech.rate =
      1;


    speech.pitch =
      1;


    speechSynthesis.cancel();


    /*
       When speech ends,
       show complete answer
    */

    speech.onend =
      function(){

        if(answerTimer){

          clearInterval(
            answerTimer
          );

          answerTimer =
            null;

        }


        voiceText.innerText =
          answer;


        voiceText.scrollTop =
          voiceText.scrollHeight;

      };


    speech.onerror =
      function(){

        status.innerText =
          "Voice reply error";

      };


    speechSynthesis.speak(
      speech
    );


  }catch(error){

    status.innerText =
      "AI error";


    voiceText.innerText =
      error.message;

  }

}


/* =========================
   CLOSE VOICE
========================= */

close.addEventListener(
  "click",
  function(){

    if(
      recorder &&
      recorder.state !==
      "inactive"
    ){

      recorder.stop();

    }


    if(
      recorder &&
      recorder.stream
    ){

      recorder.stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    }


    if(answerTimer){

      clearInterval(
        answerTimer
      );

      answerTimer =
        null;

    }


    speechSynthesis.cancel();


    voice.style.display =
      "none";

  }
);

</script>

</body>
</html>
