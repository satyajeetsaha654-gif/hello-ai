<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  width:100%;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header{
  flex-shrink:0;
  text-align:center;
  padding:16px 10px;
  font-size:25px;
  font-weight:bold;
}

.chat{
  flex:1;
  min-height:0;
  padding:12px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

.message{
  max-width:85%;
  padding:11px 14px;
  margin:9px 0;
  border-radius:18px;
  line-height:1.5;
  word-wrap:break-word;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user-message{
  margin-left:auto;
  background:#333;
}

.ai-message{
  margin-right:auto;
  background:#222;
}

.bar{
  position:relative;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom));
  background:#111;
}

.bar input{
  min-width:0;
  flex:1;
  height:46px;
  padding:12px 15px;
  border:1px solid #444;
  border-radius:24px;
  background:#222;
  color:#fff;
  outline:none;
  font-size:16px;
}

.bar button{
  flex-shrink:0;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

#plus{
  background:#333;
  color:#fff;
}

#send{
  background:#fff;
  color:#000;
}

#mic{
  background:#333;
  color:#fff;
}

#plusMenu{
  position:absolute;
  left:9px;
  bottom:65px;
  width:210px;
  max-width:calc(100vw - 18px);
  padding:8px;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:16px;
  display:none;
  box-shadow:0 10px 30px #000;
  z-index:500;
}

.option{
  width:100%;
  height:50px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  background:#333;
}

.icon{
  font-size:22px;
}

#voice{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

#close{
  position:absolute;
  top:15px;
  right:15px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:19px;
}

#orb{
  width:145px;
  height:145px;
  flex-shrink:0;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#555,#111);
  box-shadow:0 0 45px #777;
  margin-bottom:24px;
}

#status{
  font-size:18px;
  margin-bottom:10px;
  text-align:center;
}

#voiceText{
  width:100%;
  max-width:900px;
  height:42vh;
  max-height:420px;
  overflow-y:auto;
  overflow-x:hidden;
  text-align:center;
  font-size:18px;
  line-height:1.6;
  padding:15px;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:anywhere;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

#voiceMic{
  flex-shrink:0;
  margin-top:20px;
  width:70px;
  height:70px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:27px;
  cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width:600px){

  header{
    padding:13px 8px;
    font-size:22px;
  }

  .chat{
    padding:10px 9px;
  }

  .message{
    max-width:90%;
    font-size:15px;
    padding:10px 13px;
    margin:8px 0;
  }

  .bar{
    gap:6px;
    padding:7px;
    padding-bottom:calc(7px + env(safe-area-inset-bottom));
  }

  .bar input{
    height:44px;
    font-size:15px;
    padding:10px 13px;
  }

  .bar button{
    width:42px;
    height:42px;
    font-size:19px;
  }

  #plusMenu{
    bottom:62px;
    width:200px;
  }

  .option{
    height:48px;
    font-size:15px;
  }

  #orb{
    width:125px;
    height:125px;
    margin-bottom:20px;
  }

  #status{
    font-size:17px;
  }

  #voiceText{
    height:45vh;
    font-size:17px;
    padding:12px;
  }

  #voiceMic{
    width:66px;
    height:66px;
    margin-top:16px;
  }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width:380px){

  header{
    font-size:20px;
    padding:10px 6px;
  }

  .bar{
    gap:4px;
  }

  .bar button{
    width:39px;
    height:39px;
  }

  .bar input{
    height:41px;
    font-size:14px;
  }

  #orb{
    width:110px;
    height:110px;
  }

  #voiceText{
    font-size:16px;
  }

}

</style>
</head>


<body>

<div id="app">

  <header>Hello AI</header>

  <div id="chat" class="chat"></div>

  <div class="bar">

    <button type="button" id="plus">+</button>

    <div id="plusMenu">

      <button type="button" class="option" id="cameraBtn">
        <span class="icon">📷</span>
        <span>Camera</span>
      </button>

      <button type="button" class="option" id="galleryBtn">
        <span class="icon">🖼️</span>
        <span>Gallery</span>
      </button>

      <button type="button" class="option" id="documentBtn">
        <span class="icon">📄</span>
        <span>Document</span>
      </button>

    </div>

    <input
      id="question"
      type="text"
      placeholder="Ask Hello AI anything..."
    >

    <button type="button" id="send">➤</button>

    <button type="button" id="mic">🎤</button>

  </div>

</div>


<input
  id="galleryInput"
  type="file"
  accept="image/*"
  hidden
>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
>

<input
  id="documentInput"
  type="file"
  accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
  hidden
>


<!-- =========================
     VOICE SCREEN
========================= -->

<div id="voice">

  <button type="button" id="close">✕</button>

  <div id="orb"></div>

  <div id="status">Tap microphone</div>

  <div id="voiceText"></div>

  <button type="button" id="voiceMic">🎤</button>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const question =
  document.getElementById("question");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const plus =
  document.getElementById("plus");

const plusMenu =
  document.getElementById("plusMenu");

const chat =
  document.getElementById("chat");

const galleryInput =
  document.getElementById("galleryInput");

const cameraInput =
  document.getElementById("cameraInput");

const documentInput =
  document.getElementById("documentInput");

const voice =
  document.getElementById("voice");

const close =
  document.getElementById("close");

const voiceMic =
  document.getElementById("voiceMic");

const status =
  document.getElementById("status");

const voiceText =
  document.getElementById("voiceText");


let recorder = null;

let chunks = [];

let answerTimer = null;


/* =========================
   CLEAN TEXT
========================= */

function cleanDisplayText(text){

  if(!text){
    return "";
  }

  let clean = String(text);

  clean = clean.replace(
    /\*{2,}/g,
    ""
  );

  clean = clean.replace(
    /\/{2,}/g,
    ""
  );

  clean = clean.replace(
    /_{2,}/g,
    ""
  );

  clean = clean.replace(
    /\*\*/g,
    ""
  );

  clean = clean.replace(
    /__/g,
    ""
  );

  clean = clean.replace(
    /[ \t]{2,}/g,
    " "
  );

  clean = clean.replace(
    /\n{3,}/g,
    "\n\n"
  );

  return clean.trim();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText =
    cleanDisplayText(text);

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   PLUS MENU
========================= */

plus.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    if(
      plusMenu.style.display ===
      "block"
    ){

      plusMenu.style.display =
        "none";

    }else{

      plusMenu.style.display =
        "block";

    }

  }
);


document.addEventListener(
  "click",
  function(e){

    if(
      !plusMenu.contains(e.target) &&
      e.target !== plus
    ){

      plusMenu.style.display =
        "none";

    }

  }
);


/* =========================
   GALLERY
========================= */

document.getElementById(
  "galleryBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    galleryInput.click();

  }
);


galleryInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Selected image: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   CAMERA
========================= */

document.getElementById(
  "cameraBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    cameraInput.click();

  }
);


cameraInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Camera photo: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   DOCUMENT
========================= */

document.getElementById(
  "documentBtn"
).addEventListener(
  "click",
  function(){

    plusMenu.style.display =
      "none";

    documentInput.click();

  }
);


documentInput.addEventListener(
  "change",
  function(){

    if(this.files.length > 0){

      addMessage(
        "Document: " +
        this.files[0].name,
        "user-message"
      );

    }

  }
);


/* =========================
   ASK AI
========================= */

async function askAI(text){

  try{

    const response =
      await fetch(
        "/ask",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question:text
          })
        }
      );

    const data =
      await response.json();

    if(data.error){

      addMessage(
        "Error: " +
        data.error,
        "ai-message"
      );

      return null;
    }

    return cleanDisplayText(
      data.answer
    );

  }catch(error){

    addMessage(
      "Connection error: " +
      error.message,
      "ai-message"
    );

    return null;
  }

}


/* =========================
   SEND MESSAGE
========================= */

send.addEventListener(
  "click",
  async function(){

    const text =
      question.value.trim();

    if(!text){
      return;
    }

    addMessage(
      text,
      "user-message"
    );

    question.value =
      "";

    const thinking =
      document.createElement(
        "div"
      );

    thinking.className =
      "message ai-message";

    thinking.innerText =
      "Thinking...";

    chat.appendChild(
      thinking
    );

    const answer =
      await askAI(text);

    if(thinking.parentNode){

      thinking.remove();

    }

    if(answer){

      addMessage(
        answer,
        "ai-message"
      );

    }

  }
);


/* =========================
   ENTER KEY
========================= */

question.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      send.click();

    }

  }
);


/* =========================
   OPEN VOICE
========================= */

mic.addEventListener(
  "click",
  function(){

    speechSynthesis.cancel();

    if(answerTimer){

      clearInterval(
        answerTimer
      );

      answerTimer = null;

    }

    voice.style.display =
      "flex";

    voiceText.innerText =
      "";

    status.innerText =
      "Tap microphone";

  }
);


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  try{

    speechSynthesis.cancel();

    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }

      });

    chunks = [];

    recorder =
      new MediaRecorder(
        stream
      );

    recorder.ondataavailable =
      function(e){

        if(
          e.data &&
          e.data.size > 0
        ){

          chunks.push(
            e.data
          );

        }

      };

    recorder.onstop =
      sendAudio;

    status.innerText =
      "Listening...";

    voiceText.innerText =
      "Speak now";

    voiceMic.innerText =
      "⏹";

    recorder.start();

  }catch(error){

    status.innerText =
      "Microphone error";

    voiceText.innerText =
      error.message;

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  if(!recorder){
    return;
  }

  if(
    recorder.state ===
    "recording"
  ){

    recorder.stop();

  }

  if(recorder.stream){

    recorder.stream
    .getTracks()
    .forEach(
      function(track){

        track.stop();

      }
    );

  }

  voiceMic.innerText =
    "🎤";

  status.innerText =
    "Processing...";

}


/* =========================
   VOICE BUTTON
========================= */

voiceMic.addEventListener(
  "click",
  function(){

    if(
      recorder &&
      recorder.state ===
      "recording"
    ){

      stopRecording();

    }else{

      startRecording();

    }

  }
);


/* =========================
   SEND AUDIO
========================= */

async function sendAudio(){

  try{

    if(chunks.length === 0){

      status.innerText =
        "No audio";

      voiceText.innerText =
        "Please speak again.";

      return;
    }

    const blob =
      new Blob(
        chunks,
        {
          type:
            "audio/webm"
        }
      );

    const form =
      new FormData();

    form.append(
      "audio",
      blob,
      "voice-" +
      Date.now() +
      ".webm"
    );

    status.innerText =
      "Converting voice...";

    const response =
      await fetch(
        "/transcribe",
        {
          method:"POST",
          body:form
        }
      );

    const data =
      await response.json();

    if(data.error){

      status.innerText =
        "Error";

      voiceText.innerText =
        data.error;

      return;
    }

    const text =
      (data.text || "")
      .trim();

    if(!text){

      status.innerText =
        "No speech detected";

      voiceText.innerText =
        "Please speak again.";

      return;
    }

    voiceText.innerText =
      cleanDisplayText(text);

    status.innerText =
      "Thinking...";

    await voiceAsk(text);

  }catch(error){

    status.innerText =
      "Error";

    voiceText.innerText =
      error.message;

  }

}


/* =========================
   DETECT LANGUAGE
========================= */

function detectLanguage(text){

  if(
    /[\u0980-\u09FF]/.test(text)
  ){

    return "bn-IN";

  }

  if(
    /[\u0900-\u097F]/.test(text)
  ){

    return "hi-IN";

  }

  return "en-IN";
}


/* =========================
   SHOW ANSWER CHARACTER
   BY CHARACTER
========================= */

function showAnswerSlowly(answer){

  if(answerTimer){

    clearInterval(
      answerTimer
    );

    answerTimer = null;

  }

  voiceText.innerText =
    "";

  let index = 0;

  const speed = 35;

  answerTimer =
    setInterval(
      function(){

        if(index >= answer.length){

          clearInterval(
            answerTimer
          );

          answerTimer = null;

          voiceText.scrollTop =
            voiceText.scrollHeight;

          return;

        }

        voiceText.innerText +=
          answer[index];

        index++;

        voiceText.scrollTop =
          voiceText.scrollHeight;

      },
      speed
    );

}


/* =========================
   VOICE ASK AI
========================= */

async function voiceAsk(text){

  try{

    const response =
      await fetch(
        "/ask",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            question:text
          })
        }
      );

    const data =
      await response.json();

    if(data.error){

      status.innerText =
        "AI error";

      voiceText.innerText =
        data.error;

      return;

    }

    const answer =
      cleanDisplayText(
        data.answer ||
        "No answer"
      );

    status.innerText =
      "Hello AI";

    showAnswerSlowly(
      answer
    );

    const language =
      detectLanguage(
        answer
      );

    const speech =
      new SpeechSynthesisUtterance(
        answer
      );

    speech.lang =
      language;

    speech.rate =
      1;

    speech.pitch =
      1;

    speechSynthesis.cancel();

    speech.onend =
      function(){

        if(answerTimer){

          clearInterval(
            answerTimer
          );

          answerTimer =
            null;

        }

        voiceText.innerText =
          answer;

        voiceText.scrollTop =
          voiceText.scrollHeight;

      };

    speech.onerror =
      function(){

        status.innerText =
          "Voice reply error";

      };

    speechSynthesis.speak(
      speech
    );

  }catch(error){

    status.innerText =
      "AI error";

    voiceText.innerText =
      error.message;

  }

}


/* =========================
   CLOSE VOICE
========================= */

close.addEventListener(
  "click",
  function(){

    if(
      recorder &&
      recorder.state !==
      "inactive"
    ){

      recorder.stop();

    }

    if(
      recorder &&
      recorder.stream
    ){

      recorder.stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    }

    if(answerTimer){

      clearInterval(
        answerTimer
      );

      answerTimer =
        null;

    }

    speechSynthesis.cancel();

    voice.style.display =
      "none";

  }
);

</script>

</body>
</html>
