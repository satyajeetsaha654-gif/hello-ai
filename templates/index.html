<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello AI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

/* HEADER */

.header{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    background:#080808;
    border-bottom:1px solid #222;
}

/* CHAT */

.chat{
    height:calc(100vh - 125px);
    overflow-y:auto;
    padding:18px 12px 90px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

/* MESSAGE */

.message{
    max-width:82%;
    padding:11px 14px;
    border-radius:15px;
    line-height:1.5;
    font-size:15px;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.user{
    align-self:flex-end;
    background:#1677ff;
    color:#fff;
    border-bottom-right-radius:5px;
}

.ai-wrapper{
    align-self:flex-start;
    max-width:92%;
}

.ai{
    background:#181818;
    color:#fff;
    border:1px solid #292929;
    border-bottom-left-radius:5px;
}

/* ACTION BUTTONS */

.message-actions{
    display:flex;
    gap:4px;
    margin-top:4px;
    flex-wrap:wrap;
}

.action-btn{
    border:none;
    background:transparent;
    color:#888;
    font-size:16px;
    padding:5px 7px;
    border-radius:7px;
    cursor:pointer;
}

.action-btn:hover{
    background:#292929;
    color:#fff;
}

.action-btn.active{
    background:#333;
    color:#fff;
}

/* CODE */

.code-box{
    margin:9px 0;
    background:#0b0b0b;
    border:1px solid #333;
    border-radius:9px;
    overflow:hidden;
}

.code-header{
    min-height:37px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 9px;
    background:#181818;
    color:#aaa;
    font-size:12px;
}

.code-actions{
    display:flex;
    gap:5px;
}

.code-btn{
    border:none;
    background:#292929;
    color:#ddd;
    padding:5px 8px;
    border-radius:6px;
    cursor:pointer;
}

.code-btn:hover{
    background:#3a3a3a;
}

.code-content{
    margin:0;
    padding:12px;
    overflow-x:auto;
    color:#eee;
    font-family:Consolas,Monaco,monospace;
    font-size:13px;
    line-height:1.5;
    white-space:pre;
}

/* BOTTOM */

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#080808;
    border-top:1px solid #222;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
    z-index:20;
}

.input{
    flex:1;
    height:46px;
    border:none;
    outline:none;
    border-radius:13px;
    background:#191919;
    color:#fff;
    padding:0 13px;
    font-size:15px;
}

.input::placeholder{
    color:#777;
}

.btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:13px;
    background:#1c1c1c;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.btn:hover{
    background:#292929;
}

.send{
    background:#1677ff;
}

.send:hover{
    background:#2682ff;
}

/* PLUS MENU */

.plus-menu{
    position:fixed;
    bottom:78px;
    left:9px;
    background:#181818;
    border:1px solid #333;
    border-radius:11px;
    padding:7px;
    display:none;
    z-index:30;
    min-width:180px;
}

.plus-menu button{
    width:100%;
    border:none;
    background:transparent;
    color:#fff;
    padding:10px;
    text-align:left;
    border-radius:7px;
    cursor:pointer;
}

.plus-menu button:hover{
    background:#292929;
}

/* VOICE */

.voice-screen{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.voice-title{
    font-size:24px;
    margin-bottom:28px;
}

.voice-circle{
    width:105px;
    height:105px;
    border-radius:50%;
    background:#1677ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.voice-status{
    margin-top:22px;
    color:#aaa;
}

.close-voice{
    margin-top:30px;
    padding:10px 20px;
    border:none;
    border-radius:9px;
    background:#222;
    color:#fff;
    cursor:pointer;
}

/* TYPING */

.typing{
    display:flex;
    gap:4px;
}

.typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#aaa;
    animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{

    0%,80%,100%{
        opacity:.2;
    }

    40%{
        opacity:1;
    }

}

/* MOBILE */

@media(max-width:600px){

    .message{
        max-width:88%;
    }

    .ai-wrapper{
        max-width:94%;
    }

    .chat{
        padding-left:10px;
        padding-right:10px;
    }

    .btn{
        width:43px;
        height:43px;
    }

    .input{
        height:43px;
    }

}

</style>

</head>

<body>

<div class="header">
    Hello AI
</div>


<div
    id="chat"
    class="chat"
></div>


<div
    id="plusMenu"
    class="plus-menu"
>

    <button onclick="openCamera()">
        📷 Camera
    </button>

    <button onclick="openGallery()">
        🖼️ Gallery
    </button>

    <button onclick="openDocument()">
        📄 Document
    </button>

</div>


<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
>

<input
    id="galleryInput"
    type="file"
    accept="image/*"
    hidden
>

<input
    id="documentInput"
    type="file"
    accept=".pdf,.txt,.doc,.docx"
    hidden
>


<div class="bottom">

    <button
        class="btn"
        onclick="toggleMenu()"
    >
        +
    </button>

    <input
        id="messageInput"
        class="input"
        placeholder="Ask Hello AI..."
        autocomplete="off"
    >

    <button
        class="btn send"
        onclick="sendMessage()"
    >
        ➤
    </button>

    <button
        class="btn"
        onclick="openVoice()"
    >
        🎤
    </button>

</div>


<div
    id="voiceScreen"
    class="voice-screen"
>

    <div class="voice-title">
        Hello AI Voice
    </div>

    <div class="voice-circle">
        🎤
    </div>

    <div
        id="voiceStatus"
        class="voice-status"
    >
        Listening...
    </div>

    <button
        class="close-voice"
        onclick="closeVoice()"
    >
        Close
    </button>

</div>


<script>

let conversationHistory = [];

let selectedImage = null;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


/* SCROLL */

function scrollChat(){

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


/* USER MESSAGE */

function addUserMessage(text){

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.textContent =
        text;

    chat.appendChild(message);

    scrollChat();
}


/* AI MESSAGE */

function addAIMessage(
    text,
    question
){

    const chat =
        document.getElementById("chat");

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "ai-wrapper";

    wrapper.dataset.question =
        question || "";


    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.textContent =
        text;

    wrapper.appendChild(message);


    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    /* COPY */

    const copy =
        document.createElement("button");

    copy.className =
        "action-btn";

    copy.textContent =
        "📋";

    copy.title =
        "Copy";

    copy.onclick =
        function(){

            navigator.clipboard
                .writeText(text);

            copy.textContent =
                "✓";

            setTimeout(
                function(){

                    copy.textContent =
                        "📋";

                },
                1000
            );

        };


    /* LIKE */

    const like =
        document.createElement("button");

    like.className =
        "action-btn";

    like.textContent =
        "👍";

    like.title =
        "Like";

    like.onclick =
        function(){

            like.classList.toggle(
                "active"
            );

        };


    /* DISLIKE */

    const dislike =
        document.createElement("button");

    dislike.className =
        "action-btn";

    dislike.textContent =
        "👎";

    dislike.title =
        "Dislike";

    dislike.onclick =
        function(){

            dislike.classList.toggle(
                "active"
            );

        };


    /* SPEAK */

    const speak =
        document.createElement("button");

    speak.className =
        "action-btn";

    speak.textContent =
        "🔊";

    speak.title =
        "Speak";

    speak.onclick =
        function(){

            speakAnswer(
                text,
                speak
            );

        };


    /* REGENERATE */

    const regenerate =
        document.createElement("button");

    regenerate.className =
        "action-btn";

    regenerate.textContent =
        "🔄";

    regenerate.title =
        "Regenerate";

    regenerate.onclick =
        function(){

            regenerateAnswer(
                wrapper
            );

        };


    /* SHARE */

    const share =
        document.createElement("button");

    share.className =
        "action-btn";

    share.textContent =
        "📤";

    share.title =
        "Share";

    share.onclick =
        function(){

            shareAnswer(
                text,
                share
            );

        };


    actions.appendChild(copy);

    actions.appendChild(like);

    actions.appendChild(dislike);

    actions.appendChild(speak);

    actions.appendChild(regenerate);

    actions.appendChild(share);


    wrapper.appendChild(actions);

    chat.appendChild(wrapper);

    scrollChat();
}


/* SEND */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value = "";


    addUserMessage(
        text
    );


    conversationHistory.push({

        role:"user",

        content:text

    });


    conversationHistory =
        conversationHistory.slice(-12);


    const chat =
        document.getElementById("chat");


    const typing =
        document.createElement("div");


    typing.className =
        "ai-wrapper";


    typing.innerHTML =
        `
        <div class="message ai">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        `;


    chat.appendChild(
        typing
    );

    scrollChat();


    try{

        let response;


        if(selectedImage){

            response =
                await fetch(
                    "/vision",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            image:selectedImage,

                            question:text

                        })

                    }
                );

            selectedImage = null;

        }
        else{

            response =
                await fetch(
                    "/ask",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            message:text,

                            history:
                                conversationHistory
                                    .slice(0,-1)

                        })

                    }
                );

        }


        const data =
            await response.json();


        typing.remove();


        if(data.limit){

            addAIMessage(

                data.error ||
                "Your daily AI limit has expired.",

                text

            );

            return;

        }


        if(!response.ok){

            throw new Error(

                data.error ||
                "AI service is temporarily unavailable."

            );

        }


        const answer =
            data.answer ||
            "Sorry, I could not generate a response.";


        conversationHistory.push({

            role:"assistant",

            content:answer

        });


        conversationHistory =
            conversationHistory.slice(-12);


        addAIMessage(
            answer,
            text
        );

    }
    catch(error){

        console.error(
            "SEND ERROR:",
            error
        );


        typing.remove();


        addAIMessage(

            error.message ||
            "Something went wrong. Please try again.",

            text

        );

    }

}


/* ENTER */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* PLUS MENU */

function toggleMenu(){

    const menu =
        document.getElementById(
            "plusMenu"
        );

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}


function closeMenu(){

    document.getElementById(
        "plusMenu"
    ).style.display =
        "none";
}


function openCamera(){

    closeMenu();

    document.getElementById(
        "cameraInput"
    ).click();
}


function openGallery(){

    closeMenu();

    document.getElementById(
        "galleryInput"
    ).click();
}


function openDocument(){

    closeMenu();

    document.getElementById(
        "documentInput"
    ).click();
}


/* IMAGE */

function handleImage(file){

    if(!file){

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            selectedImage =
                event.target.result;


            addUserMessage(
                "🖼️ Image selected. Now type your question and press ➤."
            );

        };


    reader.readAsDataURL(file);
}


document
    .getElementById(
        "cameraInput"
    )
    .addEventListener(
        "change",
        function(){

            handleImage(
                this.files[0]
            );

            this.value = "";

        }
    );


document
    .getElementById(
        "galleryInput"
    )
    .addEventListener(
        "change",
        function(){

            handleImage(
                this.files[0]
            );

            this.value = "";

        }
    );


document
    .getElementById(
        "documentInput"
    )
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];


            if(file){

                addUserMessage(
                    "📄 Document selected: " +
                    file.name
                );

            }


            this.value = "";

        }
    );


/* REGENERATE */

async function regenerateAnswer(
    oldWrapper
){

    const question =
        oldWrapper.dataset.question;


    if(!question){

        return;

    }


    oldWrapper.remove();


    const chat =
        document.getElementById(
            "chat"
        );


    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "ai-wrapper";


    typing.innerHTML =
        `
        <div class="message ai">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        `;


    chat.appendChild(
        typing
    );


    scrollChat();


    try{

        const response =
            await fetch(
                "/ask",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:question,

                        history:
                            conversationHistory

                    })

                }
            );


        const data =
            await response.json();


        typing.remove();


        if(data.limit){

            addAIMessage(

                data.error ||
                "Your daily AI limit has expired.",

                question

            );

            return;

        }


        if(!response.ok){

            throw new Error(

                data.error ||
                "AI request failed."

            );

        }


        const answer =
            data.answer ||
            "Sorry, I could not generate a response.";


        addAIMessage(
            answer,
            question
        );

    }
    catch(error){

        console.error(
            "REGENERATE ERROR:",
            error
        );


        typing.remove();


        addAIMessage(

            error.message ||
            "Something went wrong. Please try again.",

            question

        );

    }

}


/* SPEAK */

async function speakAnswer(
    text,
    button
){

    try{

        button.textContent =
            "⏳";


        let language =
            "en-IN";


        if(
            /[\u0980-\u09FF]/.test(text)
        ){

            language =
                "bn-IN";

        }
        else if(
            /[\u0900-\u097F]/.test(text)
        ){

            language =
                "hi-IN";

        }


        const response =
            await fetch(
                "/tts",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        language:language

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(

                data.error ||
                "Voice generation failed."

            );

        }


        if(!data.audio){

            throw new Error(
                "No audio returned."
            );

        }


        const audio =
            new Audio(
                "data:audio/wav;base64," +
                data.audio
            );


        await audio.play();


        button.textContent =
            "🔊";

    }
    catch(error){

        console.error(
            "TTS ERROR:",
            error
        );


        button.textContent =
            "🔊";


        alert(
            error.message ||
            "Voice generation failed."
        );

    }

}


/* SHARE */

async function shareAnswer(
    text,
    button
){

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:"Hello AI",

                text:text

            });

        }
        else{

            await navigator.clipboard
                .writeText(text);
            button.textContent = "✓";

            setTimeout(
                function(){
                    button.textContent = "📤";
                },
                1000
            );
        }

    }
    catch(error){

        console.error(
            "SHARE ERROR:",
            error
        );

        button.textContent = "📤";

    }

}


/* VOICE */

function openVoice(){

    const screen =
        document.getElementById(
            "voiceScreen"
        );

    screen.style.display =
        "flex";

    startRecording();

}


function closeVoice(){

    stopRecording();

    document.getElementById(
        "voiceScreen"
    ).style.display =
        "none";

}


/* RECORDING */

async function startRecording(){

    if(isRecording){

        return;

    }

    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        mediaRecorder =
            new MediaRecorder(stream);

        audioChunks = [];

        isRecording = true;

        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Listening...";

        mediaRecorder.ondataavailable =
            function(event){

                if(event.data.size > 0){

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async function(){

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:"audio/webm"
                        }
                    );

                stream
                    .getTracks()
                    .forEach(
                        function(track){
                            track.stop();
                        }
                    );

                await processVoice(
                    blob
                );

            };

        mediaRecorder.start();

    }
    catch(error){

        console.error(
            "MIC ERROR:",
            error
        );

        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Microphone permission required.";

    }

}


function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();

    }

    isRecording = false;

}


/* VOICE TO TEXT */

async function processVoice(
    audioBlob
){

    const status =
        document.getElementById(
            "voiceStatus"
        );

    status.textContent =
        "Processing...";

    try{

        const formData =
            new FormData();

        formData.append(
            "audio",
            audioBlob,
            "voice.webm"
        );

        const response =
            await fetch(
                "/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );

        const data =
            await response.json();

        if(data.limit){

            status.textContent =
                "Your daily AI limit has expired.";

            return;

        }

        if(!response.ok){

            throw new Error(
                data.error ||
                "Voice transcription failed."
            );

        }

        const text =
            (data.text || "").trim();

        if(!text){

            status.textContent =
                "No speech detected.";

            return;

        }

        closeVoice();

        document.getElementById(
            "messageInput"
        ).value = text;

        await sendMessage();

    }
    catch(error){

        console.error(
            "VOICE ERROR:",
            error
        );

        status.textContent =
            error.message ||
            "Voice processing failed.";

    }

}


/* INITIAL MESSAGE */


</script>

</body>
</html>
