<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:22px;
  font-size:28px;
  font-weight:bold;
}

.chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

/* CHAT MESSAGE */

.message{
  max-width:80%;
  padding:11px 15px;
  margin:10px 0;
  border-radius:18px;
  line-height:1.5;
  word-wrap:break-word;
}

.user-message{
  margin-left:auto;
  background:#333;
  text-align:left;
}

.ai-message{
  margin-right:auto;
  background:#222;
  text-align:left;
}

/* INPUT BAR */

.bar{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  background:#111;
}

.bar input{
  flex:1;
  padding:14px 16px;
  border:1px solid #444;
  border-radius:25px;
  background:#222;
  color:#fff;
  outline:none;
  font-size:15px;
}

.bar button{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  font-size:21px;
}

#plus{
  background:#333;
  color:#fff;
}

#send{
  background:#fff;
  color:#000;
}

#mic{
  background:#333;
  color:#fff;
}

/* PLUS MENU */

#plusMenu{
  position:absolute;
  left:12px;
  bottom:70px;
  width:210px;
  padding:8px;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:16px;
  display:none;
  box-shadow:0 10px 30px #000;
  z-index:500;
}

.option{
  width:100%;
  height:50px;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  background:#333;
}

.icon{
  font-size:23px;
}

/* VOICE */

#voice{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#close{
  position:absolute;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:20px;
}

#orb{
  width:170px;
  height:170px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#555,#111);
  box-shadow:0 0 50px #777;
  margin-bottom:30px;
}

#status{
  font-size:20px;
  margin-bottom:15px;
}

#voiceText{
  width:85%;
  max-width:700px;
  text-align:center;
  font-size:19px;
  line-height:1.5;
}

#voiceMic{
  margin-top:30px;
  width:75px;
  height:75px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:28px;
  cursor:pointer;
}

/* CREATE IMAGE */

#createImage{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1100;
  padding:25px;
}

#createImage h2{
  margin-bottom:20px;
}

#imagePrompt{
  width:90%;
  max-width:600px;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  font-size:16px;
}

#createBtn{
  margin-top:15px;
  padding:13px 25px;
  border:0;
  border-radius:25px;
  cursor:pointer;
}

#closeImage{
  position:absolute;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:20px;
}
</style>
</head>

<body>

<div id="app">

  <header>Hello AI</header>

  <!-- CHAT AREA -->
  <div id="chat" class="chat"></div>

  <!-- INPUT AREA -->
  <div class="bar">

    <button id="plus">+</button>

    <!-- PLUS MENU -->
    <div id="plusMenu">

      <button class="option" id="cameraBtn">
        <span class="icon">📷</span>
        <span>Camera</span>
      </button>

      <button class="option" id="galleryBtn">
        <span class="icon">🖼️</span>
        <span>Gallery</span>
      </button>

      <button class="option" id="documentBtn">
        <span class="icon">📄</span>
        <span>Document</span>
      </button>

      <button class="option" id="createImageBtn">
        <span class="icon">🎨</span>
        <span>Create Image</span>
      </button>

    </div>

    <input
      id="question"
      type="text"
      placeholder="Ask Hello AI anything..."
    >

    <button id="send">➤</button>

    <button id="mic">🎤</button>

  </div>

</div>


<!-- FILE INPUTS -->

<input
  id="galleryInput"
  type="file"
  accept="image/*"
  hidden
>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
>

<input
  id="documentInput"
  type="file"
  accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
  hidden
>


<!-- VOICE SCREEN -->

<div id="voice">

  <button id="close">✕</button>

  <div id="orb"></div>

  <div id="status">Tap microphone</div>

  <div id="voiceText"></div>

  <button id="voiceMic">🎤</button>

</div>


<!-- CREATE IMAGE -->

<div id="createImage">

  <button id="closeImage">✕</button>

  <h2>Create Image</h2>

  <input
    id="imagePrompt"
    placeholder="Describe the image..."
  >

  <button id="createBtn">
    Create
  </button>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const question =
  document.getElementById("question");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const plus =
  document.getElementById("plus");

const plusMenu =
  document.getElementById("plusMenu");

const chat =
  document.getElementById("chat");

const galleryInput =
  document.getElementById("galleryInput");

const cameraInput =
  document.getElementById("cameraInput");

const documentInput =
  document.getElementById("documentInput");

const createImageBtn =
  document.getElementById("createImageBtn");

const createImage =
  document.getElementById("createImage");

const closeImage =
  document.getElementById("closeImage");

const voice =
  document.getElementById("voice");

const close =
  document.getElementById("close");

const voiceMic =
  document.getElementById("voiceMic");

const status =
  document.getElementById("status");

const voiceText =
  document.getElementById("voiceText");


let recorder = null;
let chunks = [];


/* =========================
   ADD CHAT MESSAGE
========================= */

function addMessage(text, type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   PLUS MENU
========================= */

plus.onclick = (e)=>{

  e.stopPropagation();

  if(
    plusMenu.style.display === "block"
  ){

    plusMenu.style.display = "none";

  }else{

    plusMenu.style.display = "block";

  }

};


document.addEventListener("click",(e)=>{

  if(
    !plusMenu.contains(e.target) &&
    e.target !== plus
  ){

    plusMenu.style.display = "none";

  }

});


/* =========================
   GALLERY
========================= */

document.getElementById(
  "galleryBtn"
).onclick = ()=>{

  plusMenu.style.display = "none";

  galleryInput.click();

};


galleryInput.onchange = ()=>{

  if(galleryInput.files.length > 0){

    const file =
      galleryInput.files[0];

    addMessage(
      "Selected image: " + file.name,
      "user-message"
    );

  }

};


/* =========================
   CAMERA
========================= */

document.getElementById(
  "cameraBtn"
).onclick = ()=>{

  plusMenu.style.display = "none";

  cameraInput.click();

};


cameraInput.onchange = ()=>{

  if(cameraInput.files.length > 0){

    const file =
      cameraInput.files[0];

    addMessage(
      "Camera photo: " + file.name,
      "user-message"
    );

  }

};


/* =========================
   DOCUMENT
========================= */

document.getElementById(
  "documentBtn"
).onclick = ()=>{

  plusMenu.style.display = "none";

  documentInput.click();

};


documentInput.onchange = ()=>{

  if(documentInput.files.length > 0){

    const file =
      documentInput.files[0];

    addMessage(
      "Document: " + file.name,
      "user-message"
    );

  }

};


/* =========================
   CREATE IMAGE
========================= */

createImageBtn.onclick = ()=>{

  plusMenu.style.display = "none";

  createImage.style.display = "flex";

};


closeImage.onclick = ()=>{

  createImage.style.display = "none";

};


/* =========================
   ASK AI
========================= */

async function askAI(text){

  try{

    const r =
      await fetch(
        "/ask?time=" + Date.now(),
        {
          method:"POST",
          cache:"no-store",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            question:text
          })
        }
      );


    const data =
      await r.json();


    if(data.error){

      addMessage(
        "Error: " + data.error,
        "ai-message"
      );

      return null;

    }


    return data.answer;


  }catch(e){

    addMessage(
      "Connection error: " +
      e.message,
      "ai-message"
    );

    return null;

  }

}


/* =========================
   SEND TEXT MESSAGE
========================= */

send.onclick = async ()=>{

  const text =
    question.value.trim();

  if(!text) return;


  /* SHOW USER QUESTION */

  addMessage(
    text,
    "user-message"
  );


  question.value = "";


  /* AI THINKING */

  const thinking =
    document.createElement("div");

  thinking.className =
    "message ai-message";

  thinking.innerText =
    "Thinking...";

  chat.appendChild(thinking);

  chat.scrollTop =
    chat.scrollHeight;


  /* GET ANSWER */

  const answer =
    await askAI(text);


  /* REMOVE THINKING */

  if(thinking.parentNode){

    thinking.remove();

  }


  /* SHOW AI ANSWER */

  if(answer){

    addMessage(
      answer,
      "ai-message"
    );

  }

};


/* ENTER KEY */

question.addEventListener(
  "keydown",
  (e)=>{

    if(e.key === "Enter"){

      send.click();

    }

  }
);


/* =========================
   OPEN VOICE
========================= */

mic.onclick = ()=>{

  speechSynthesis.cancel();

  voice.style.display =
    "flex";

  voiceText.innerText =
    "";

  status.innerText =
    "Tap microphone";

};


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  try{

    speechSynthesis.cancel();


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }

      });


    chunks = [];


    recorder =
      new MediaRecorder(stream);


    recorder.ondataavailable =
      (e)=>{

        if(
          e.data &&
          e.data.size > 0
        ){

          chunks.push(e.data);

        }

      };


    recorder.onstop =
      sendAudio;


    status.innerText =
      "Get ready...";


    setTimeout(()=>{

      if(!recorder) return;


      recorder.start();


      status.innerText =
        "Listening...";


      voiceText.innerText =
        "Speak now";


      voiceMic.innerText =
        "⏹";


    },500);


  }catch(e){

    status.innerText =
      "Microphone error";

    voiceText.innerText =
      e.message;

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  if(!recorder) return;


  if(
    recorder.state === "recording"
  ){

    recorder.stop();

  }


  if(recorder.stream){

    recorder.stream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  }


  voiceMic.innerText =
    "🎤";

  status.innerText =
    "Processing...";

}


/* =========================
   VOICE MIC
========================= */

voiceMic.onclick = ()=>{

  if(
    recorder &&
    recorder.state === "recording"
  ){

    stopRecording();

  }else{

    startRecording();

  }

};


/* =========================
   SEND AUDIO
========================= */

async function sendAudio(){

  try{

    if(chunks.length === 0){

      status.innerText =
        "No audio";

      voiceText.innerText =
        "Please speak again.";

      return;

    }


    const blob =
      new Blob(
        chunks,
        {type:"audio/webm"}
      );


    const form =
      new FormData();


    form.append(
      "audio",
      blob,
      "voice-" +
      Date.now() +
      ".webm"
    );


    status.innerText =
      "Converting voice...";


    const r =
      await fetch(
        "/transcribe?time=" +
        Date.now(),
        {
          method:"POST",
          cache:"no-store",
          body:form
        }
      );


    const data =
      await r.json();


    if(data.error){

      status.innerText =
        "Error";

      voiceText.innerText =
        data.error;

      return;

    }


    const text =
      (data.text || "").trim();


    if(!text){

      status.innerText =
        "No speech detected";

      voiceText.innerText =
        "Please speak again.";

      return;

    }


    /* SHOW TRANSCRIBED QUESTION */

    voiceText.innerText =
      text;


    status.innerText =
      "Thinking...";


    await voiceAsk(text);


  }catch(e){

    status.innerText =
      "Error";

    voiceText.innerText =
      e.message;

  }

}


/* =========================
   VOICE ASK AI
========================= */

async function voiceAsk(text){

  try{

    const r =
      await fetch(
        "/ask?time=" +
        Date.now(),
        {
          method:"POST",
          cache:"no-store",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            question:text
          })
        }
      );


    const data =
      await r.json();


    if(data.error){

      status.innerText =
        "AI error";

      voiceText.innerText =
        data.error;

      return;

    }


    const answer =
      data.answer ||
      "No answer";


    status.innerText =
      "Hello AI";


    voiceText.innerText =
      answer;


    /* SPOKEN ANSWER */

    const speech =
      new SpeechSynthesisUtterance(
        answer
      );


    speech.lang =
      "en-IN";

    speech.rate =
      1;

    speech.pitch =
      1;


    speechSynthesis.cancel();

    speechSynthesis.speak(
      speech
    );


  }catch(e){

    status.innerText =
      "AI error";

    voiceText.innerText =
      e.message;

  }

}


/* =========================
   CLOSE VOICE
========================= */

close.onclick = ()=>{

  if(
    recorder &&
    recorder.state !== "inactive"
  ){

    recorder.stop();

  }


  if(
    recorder &&
    recorder.stream
  ){

    recorder.stream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  }


  speechSynthesis.cancel();

  voice.style.display =
    "none";

};

</script>

</body>
</html>
